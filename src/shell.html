<title>ARES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap">

<style>
/* ============ ARES — système de design « la forge » ============ */
:root{
  --coal:#130D0B; --pit:#1A1211; --slab:#241917; --slab2:#2E211C;
  --edge:#3B2A23; --edge2:#54392C;
  --bone:#F6ECE3; --ash:#B9A395; --ash2:#8C776C;
  --bronze:#E2762E; --ember:#F6B23D; --serpent:#4FBFB4; --vine:#7CC98A; --blood:#E2544B; --olympe:#D4AF37;
  --accent:var(--bronze);
  --shadow:0 18px 44px rgba(0,0,0,.55);
  --r:14px; --r-s:9px;
  --disp:'Big Shoulders Display','Oswald','Arial Narrow',system-ui,sans-serif;
  --body:'Manrope','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono','Consolas','Courier New',monospace;
  --rail:250px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--coal); color:var(--bone);
  font-family:var(--body); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1100px 620px at 78% -12%, rgba(226,118,46,.16), transparent 62%),
    radial-gradient(760px 520px at 4% 8%, rgba(79,191,180,.09), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:var(--disp); font-weight:800; line-height:.98; text-wrap:balance; margin:0; letter-spacing:.005em}
p{margin:0}
a{color:var(--ember); text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit; color:inherit}
code,pre,kbd{font-family:var(--mono)}
:focus-visible{outline:2.5px solid var(--ember); outline-offset:2px; border-radius:4px}
::selection{background:rgba(226,118,46,.35)}
.hidden{display:none !important}

*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:var(--pit)}
*::-webkit-scrollbar-thumb{background:var(--edge2); border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:var(--bronze)}

/* ============ Rail de navigation ============ */
#rail{
  position:fixed; inset:0 auto 0 0; width:var(--rail); z-index:60;
  background:linear-gradient(180deg,#180F0D,#120B09);
  border-right:1px solid var(--edge); display:flex; flex-direction:column; gap:2px;
  padding:18px 14px; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:11px; cursor:pointer; padding:2px 4px 16px; border:0; background:none; text-align:left; width:100%}
.brand .sigil{width:40px;height:40px;flex:none}
.brand b{font-family:var(--disp); font-size:34px; letter-spacing:.10em; display:block; line-height:.85}
.brand small{color:var(--ash2); font-size:9.5px; letter-spacing:.32em; text-transform:uppercase; font-weight:800}
.rail-label{font-size:9.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--ash2); font-weight:800; margin:16px 6px 7px}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; padding:9px 11px; border-radius:var(--r-s);
  border:1px solid transparent; background:none; cursor:pointer; font-size:14px; font-weight:600; color:var(--ash);
  transition:background .16s, color .16s, transform .16s; text-align:left;
}
.nav-item:hover{background:var(--slab); color:var(--bone); transform:translateX(2px)}
.nav-item.on{background:var(--slab2); color:var(--bone); border-color:var(--edge2)}
.nav-item .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--ash2));box-shadow:0 0 10px var(--c,transparent)}
.nav-item .lk{margin-left:auto; font-size:11px; color:var(--ash2)}
.rail-foot{margin-top:auto; padding-top:16px; border-top:1px solid var(--edge)}
.xpwrap{padding:4px 6px}
.xpline{display:flex; justify-content:space-between; align-items:baseline; font-size:11.5px; color:var(--ash); margin-bottom:6px; font-weight:700}
.xpline b{font-family:var(--disp); font-size:19px; color:var(--ember); letter-spacing:.04em}
.bar{height:7px; background:#0D0705; border-radius:99px; overflow:hidden; border:1px solid var(--edge)}
.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--bronze),var(--ember)); border-radius:99px; transition:width .7s cubic-bezier(.2,.9,.3,1)}

/* ============ Zone principale ============ */
#main{margin-left:var(--rail); min-height:100vh}
.wrap{max-width:1160px; margin:0 auto; padding:0 30px}
.view{display:none; padding:52px 0 90px; animation:rise .5s cubic-bezier(.2,.9,.3,1) both}
.view.on{display:block}
@keyframes rise{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}

/* ============ Accueil ============ */
.hero{position:relative; padding:72px 0 40px; overflow:hidden}
#forge{position:absolute; inset:0; width:100%; height:100%; opacity:.55; pointer-events:none}
.hero-in{position:relative; z-index:2; max-width:820px}
.kicker{display:inline-flex; align-items:center; gap:9px; font-size:11px; font-weight:800; letter-spacing:.24em; text-transform:uppercase; color:var(--ember); border:1px solid var(--edge2); background:rgba(246,178,61,.07); padding:7px 14px; border-radius:99px}
.hero h1{font-size:clamp(76px,15vw,190px); letter-spacing:.02em; margin:20px 0 0;
  background:linear-gradient(178deg,#FFF6EC 8%,#F6B23D 48%,#C2551B 96%); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 12px 28px rgba(226,118,46,.28));}
.hero .sub{font-family:var(--disp); font-size:clamp(24px,3.6vw,40px); font-weight:700; color:var(--bone); letter-spacing:.01em; margin-top:2px}
.hero p.lead{font-size:18.5px; color:var(--ash); margin-top:20px; max-width:62ch}
.hero p.lead b{color:var(--bone); font-weight:800}
.cta-row{display:flex; flex-wrap:wrap; gap:12px; margin-top:30px}

.btn{
  display:inline-flex; align-items:center; gap:9px; padding:13px 24px; border-radius:var(--r-s); cursor:pointer;
  font-weight:800; font-size:14.5px; border:1px solid var(--edge2); background:var(--slab); color:var(--bone);
  transition:transform .16s, box-shadow .16s, background .16s; letter-spacing:.01em;
}
.btn:hover{transform:translateY(-2px); background:var(--slab2)}
.btn.primary{background:linear-gradient(180deg,var(--ember),var(--bronze)); color:#20100A; border-color:#B85C1E; box-shadow:0 10px 26px rgba(226,118,46,.32)}
.btn.primary:hover{box-shadow:0 16px 34px rgba(226,118,46,.44)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 15px; font-size:13px}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}

.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:54px}
.stat{background:linear-gradient(180deg,var(--pit),rgba(26,18,17,.4)); border:1px solid var(--edge); border-radius:var(--r); padding:18px 20px}
.stat b{display:block; font-family:var(--disp); font-size:44px; color:var(--ember); line-height:.9}
.stat span{font-size:11.5px; text-transform:uppercase; letter-spacing:.16em; color:var(--ash2); font-weight:800}

.sec-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin:74px 0 22px; flex-wrap:wrap}
.sec-head h2{font-size:clamp(34px,5vw,54px)}
.sec-head p{color:var(--ash); max-width:56ch; font-size:15px}

.paths{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px}
.path-card{
  position:relative; border:1px solid var(--edge); border-radius:var(--r); overflow:hidden; cursor:pointer;
  background:linear-gradient(180deg,var(--pit),#150E0C); padding:26px 24px 22px; text-align:left; width:100%;
  transition:transform .2s cubic-bezier(.2,.9,.3,1), border-color .2s, box-shadow .2s;
}
.path-card:hover{transform:translateY(-6px); border-color:var(--c); box-shadow:0 22px 44px rgba(0,0,0,.5)}
.path-card::before{content:''; position:absolute; inset:0 0 auto 0; height:3px; background:var(--c)}
.path-card::after{content:''; position:absolute; right:-52px; top:-52px; width:150px; height:150px; border-radius:50%; background:var(--c); opacity:.09; filter:blur(18px)}
.path-card .glyph{font-family:var(--mono); font-size:13px; font-weight:700; color:var(--c); letter-spacing:.1em}
.path-card h3{font-size:37px; margin:8px 0 2px}
.path-card .tag{font-size:12.5px; color:var(--ash2); font-weight:700; text-transform:uppercase; letter-spacing:.14em}
.path-card p{color:var(--ash); font-size:14.5px; margin-top:13px; min-height:66px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
.chip{font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; background:var(--slab); border:1px solid var(--edge2); color:var(--ash)}
.path-card .prog{margin-top:18px}
.path-card .prog .bar{height:6px}
.path-card .prog span{font-size:11px; color:var(--ash2); font-weight:700; display:block; margin-top:7px; letter-spacing:.06em}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:22px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:22px}
.card{background:var(--pit); border:1px solid var(--edge); border-radius:var(--r); padding:26px}
.card h3{font-size:26px; margin-bottom:11px}
.card p{color:var(--ash); font-size:14.5px}
.icon-row{display:flex; align-items:center; gap:11px; margin-bottom:10px}
.icon-badge{width:36px;height:36px;border-radius:9px; display:grid; place-items:center; background:var(--slab2); border:1px solid var(--edge2); font-size:17px}

/* ============ Page parcours ============ */
.path-hero{border:1px solid var(--edge); border-radius:var(--r); padding:30px 32px; background:linear-gradient(120deg,var(--pit),#150E0C 70%); position:relative; overflow:hidden}
.path-hero::after{content:''; position:absolute; right:-70px; top:-90px; width:280px; height:280px; border-radius:50%; background:var(--c); opacity:.1; filter:blur(40px)}
.path-hero h1{font-size:clamp(46px,8vw,84px); color:var(--c)}
.path-hero p{color:var(--ash); max-width:64ch; margin-top:12px; font-size:16px; position:relative}
.crumb{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ash2); font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:16px}
.crumb button{background:none;border:0;cursor:pointer;color:var(--ash2);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;padding:0}
.crumb button:hover{color:var(--ember)}

.day{margin-top:34px; border:1px solid var(--edge); border-radius:var(--r); background:var(--pit); overflow:hidden}
.day-head{display:flex; align-items:center; gap:18px; padding:24px 28px; background:linear-gradient(90deg,var(--slab),transparent)}
.day-num{font-family:var(--disp); font-size:52px; line-height:.8; color:var(--c); width:56px; flex:none; text-align:center}
.day-head h3{font-size:29px}
.day-head p{color:var(--ash2); font-size:13.5px; font-weight:600}
.day-head .lock{margin-left:auto; font-size:12px; color:var(--ash2); font-weight:700}
.lesson-list{display:flex; flex-direction:column; border-top:1px solid var(--edge)}
.lrow{display:flex; align-items:center; gap:16px; padding:18px 28px; border-bottom:1px solid rgba(59,42,35,.5); background:none; border-left:0; border-right:0; border-top:0; cursor:pointer; text-align:left; transition:background .15s, padding-left .15s}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--slab); padding-left:29px}
.lrow .st{width:26px;height:26px;border-radius:50%;border:2px solid var(--edge2); flex:none; display:grid; place-items:center; font-size:13px; color:var(--ash2); font-weight:800}
.lrow.done .st{background:var(--vine); border-color:var(--vine); color:#0C2410}
.lrow .info{flex:1 1 auto; min-width:0}
.lrow .t{font-weight:700; font-size:15.5px}
.lrow .d{font-size:13px; color:var(--ash2)}
.lrow .kind{margin-left:auto; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; color:var(--ash2); border:1px solid var(--edge2); padding:3px 9px; border-radius:99px; white-space:nowrap}
.lrow .kind[data-k="jeu"]{color:var(--ember); border-color:#6B4A22}
.lrow .kind[data-k="projet"]{color:var(--serpent); border-color:#265A56}
.lrow .kind[data-k="boss"]{color:var(--blood); border-color:#6D2A26}

/* ============ Leçon ============ */
.lesson-top{display:flex; align-items:flex-start; gap:20px; flex-wrap:wrap; margin-bottom:22px}
.lesson-top h1{font-size:clamp(36px,5.5vw,58px)}
.lesson-top .goal{color:var(--ash); font-size:15.5px; margin-top:8px; max-width:66ch}

/* etapes leçon -> exercices : une seule chose a la fois a l'ecran */
.stepper{display:flex; gap:22px; border-bottom:1px solid var(--edge); margin-bottom:28px}
.step-tab{
  display:flex; align-items:center; gap:9px; padding:11px 2px 15px; margin-bottom:-1px;
  background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  font-weight:800; font-size:15px; color:var(--ash2); transition:color .15s, border-color .15s;
}
.step-tab span{
  width:23px; height:23px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:var(--slab); border:1px solid var(--edge2); font-family:var(--mono); font-size:12px; color:var(--ash2);
  transition:background .15s, border-color .15s, color .15s;
}
.step-tab:hover:not(.on){color:var(--bone)}
.step-tab.on{color:var(--bone); border-color:var(--ember)}
.step-tab.on span{background:var(--ember); border-color:var(--ember); color:#20100A}
.step-stage[hidden]{display:none}
.lesson-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:30px; align-items:start}
.lesson-grid.solo{grid-template-columns:minmax(0,1fr)}
.pane{background:var(--pit); border:1px solid var(--edge); border-radius:var(--r); padding:32px 34px}
.pane.sticky{position:sticky; top:22px}
.prose h2{font-size:27px; margin:42px 0 16px; color:var(--bone)}
.prose h2:first-child{margin-top:0}
.prose h3{font-size:20px; margin:30px 0 12px; font-family:var(--body); font-weight:800}
.prose p{margin:18px 0; color:#E4D7CC; font-size:15.5px; line-height:1.75}
.prose ul,.prose ol{margin:18px 0; padding-left:22px; color:#E4D7CC; font-size:15.5px; line-height:1.75}
.prose li{margin:9px 0}
.prose strong{color:var(--bone); font-weight:800}
.prose em{color:var(--ember); font-style:normal; font-weight:700}
.prose code{background:#0E0806; border:1px solid var(--edge); padding:1.5px 6px; border-radius:5px; font-size:.9em; color:var(--ember)}
.callout{border-left:3px solid var(--cl,var(--bronze)); background:var(--slab); border-radius:0 var(--r-s) var(--r-s) 0; padding:18px 22px; margin:28px 0}
.callout .h{font-family:var(--disp); font-size:19px; letter-spacing:.04em; color:var(--cl,var(--ember)); margin-bottom:6px}
.callout p{margin:6px 0; font-size:14.5px; color:#E4D7CC; line-height:1.65}
.callout.tip{--cl:var(--serpent)} .callout.warn{--cl:var(--blood)} .callout.key{--cl:var(--ember)}
.analogy{background:linear-gradient(120deg,rgba(79,191,180,.09),transparent); border:1px dashed #2F544F; border-radius:var(--r-s); padding:14px 18px; margin:18px 0; font-size:14.5px; color:#D9E9E7}
.analogy b{color:var(--serpent)}

pre.code{background:#0C0705; border:1px solid var(--edge); border-radius:var(--r-s); padding:15px 17px; overflow-x:auto; font-size:13.5px; line-height:1.62; margin:14px 0; tab-size:4}
pre.code .cm{color:#7C6A5F} pre.code .kw{color:#F08B4E; font-weight:700} pre.code .str{color:#8FD3A0}
pre.code .nb{color:#6FC6D6} pre.code .nu{color:#F6B23D} pre.code .tg{color:#F08B4E}
.codecap{display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ash2); font-weight:800; margin-top:16px}
.codecap i{width:8px;height:8px;border-radius:2px;background:var(--bronze);font-style:normal}

.out{background:#080504; border:1px solid var(--edge); border-radius:var(--r-s); padding:13px 15px; font-family:var(--mono); font-size:13px; white-space:pre-wrap; word-break:break-word; color:#CFE8D5; min-height:52px; max-height:320px; overflow:auto; line-height:1.55}
.out .err{color:#FF8C82}
.out .muted{color:var(--ash2)}
.out-head{display:flex; align-items:center; gap:8px; font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ash2); font-weight:800; margin:14px 0 7px}
.out-head .lamp{width:8px;height:8px;border-radius:50%;background:var(--vine); box-shadow:0 0 8px var(--vine)}

.editor{position:relative; border:1px solid var(--edge2); border-radius:var(--r-s); overflow:hidden; background:#0B0605}
.editor-bar{display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--slab); border-bottom:1px solid var(--edge)}
.editor-bar .dots{display:flex; gap:5px}
.editor-bar .dots i{width:9px;height:9px;border-radius:50%;background:var(--edge2)}
.editor-bar .fname{font-family:var(--mono); font-size:11.5px; color:var(--ash2)}
.editor-bar .right{margin-left:auto; display:flex; gap:6px}
.editor textarea{
  width:100%; min-height:210px; background:transparent; border:0; resize:vertical; padding:14px 16px;
  color:#F2E3D6; font-family:var(--mono); font-size:13.5px; line-height:1.62; outline:none; tab-size:4; display:block;
}
.editor textarea::placeholder{color:#5D4C43}
.run-row{display:flex; gap:9px; flex-wrap:wrap; margin-top:12px; align-items:center}
.verdict{padding:13px 16px; border-radius:var(--r-s); margin-top:12px; font-size:14.5px; font-weight:600; display:none; border:1px solid transparent}
.verdict.on{display:block; animation:pop .3s cubic-bezier(.2,1.2,.4,1) both}
.verdict.ok{background:rgba(124,201,138,.11); border-color:#2F5E3A; color:#BFE9C8}
.verdict.ko{background:rgba(226,84,75,.1); border-color:#6D2A26; color:#F6C4BF}
.verdict b{display:block; font-family:var(--disp); font-size:22px; letter-spacing:.04em; margin-bottom:3px}
@keyframes pop{from{opacity:0; transform:scale(.97) translateY(6px)} to{opacity:1; transform:none}}

.preview{background:#fff; border-radius:var(--r-s); border:1px solid var(--edge2); padding:16px; color:#111; min-height:150px; overflow:auto; max-height:460px}

.q{border:1px solid var(--edge); border-radius:var(--r); padding:24px 26px; margin-top:22px; background:var(--pit)}
.q .num{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ash2); font-weight:800}
.q h4{font-size:19px; margin:8px 0 18px; font-family:var(--body); font-weight:800; line-height:1.4}
.opts{display:flex; flex-direction:column; gap:11px}
.opt{display:flex; align-items:center; gap:12px; padding:12px 15px; border:1px solid var(--edge2); border-radius:var(--r-s); background:var(--slab); cursor:pointer; text-align:left; font-size:14.5px; font-weight:600; transition:transform .13s, border-color .13s, background .13s; width:100%}
.opt:hover:not(:disabled){transform:translateX(4px); border-color:var(--ember)}
.opt .k{width:24px;height:24px;border-radius:6px; background:#0D0806; border:1px solid var(--edge2); display:grid; place-items:center; font-family:var(--mono); font-size:12px; flex:none; color:var(--ash)}
.opt.good{background:rgba(124,201,138,.14); border-color:var(--vine)}
.opt.bad{background:rgba(226,84,75,.12); border-color:var(--blood)}
.opt:disabled{cursor:default}
.expl{margin-top:12px; padding:12px 15px; border-radius:var(--r-s); background:var(--slab); font-size:14px; color:#E4D7CC; display:none; border-left:3px solid var(--ember)}
.expl.on{display:block}

.game-hud{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.hud{background:var(--slab); border:1px solid var(--edge2); border-radius:var(--r-s); padding:9px 15px; min-width:96px}
.hud b{display:block; font-family:var(--disp); font-size:26px; line-height:1; color:var(--ember)}
.hud span{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ash2); font-weight:800}
.lines{display:flex; flex-direction:column; gap:6px; margin-top:6px}
.line{display:flex; gap:10px; align-items:center; font-family:var(--mono); font-size:13.5px; padding:9px 13px; border-radius:var(--r-s); border:1px solid var(--edge); background:#0C0705; cursor:pointer; text-align:left; width:100%; white-space:pre; overflow-x:auto; transition:border-color .14s, background .14s; color:#E9DACD}
.line:hover{border-color:var(--ember); background:#150D09}
.line .ln{color:var(--ash2); font-size:11px; width:18px; flex:none; text-align:right}
.line.good{border-color:var(--vine); background:rgba(124,201,138,.1)}
.line.bad{border-color:var(--blood); background:rgba(226,84,75,.1)}
.line.pick{border-color:var(--ember); background:rgba(246,178,61,.09)}
.timerbar{height:5px; background:#0D0705; border-radius:99px; overflow:hidden; margin:10px 0 4px; border:1px solid var(--edge)}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blood),var(--ember)); width:100%}

.locked{position:relative}
.lock-veil{
  position:absolute; inset:0; border-radius:var(--r); backdrop-filter:blur(3px); background:rgba(15,9,7,.74);
  display:grid; place-items:center; text-align:center; padding:24px; z-index:3;
}
.lock-veil .in{max-width:360px}
.lock-veil h4{font-family:var(--disp); font-size:28px; color:var(--ember)}
.lock-veil p{font-size:13.5px; color:var(--ash); margin:6px 0 14px}
.keyform{display:flex; gap:9px; flex-wrap:wrap}
.keyform input{
  flex:1; min-width:200px; background:#0C0705; border:1px solid var(--edge2); border-radius:var(--r-s); padding:12px 15px;
  color:var(--bone); font-family:var(--mono); font-size:14px; letter-spacing:.08em; text-transform:uppercase;
}
.keyform input:focus{border-color:var(--ember); outline:none}
.pro-banner{border:1px solid #6B4A22; background:linear-gradient(120deg,rgba(246,178,61,.10),transparent 60%); border-radius:var(--r); padding:26px 28px; margin-top:20px}
.pro-banner h2{font-size:40px; color:var(--ember)}
.price{display:flex; align-items:baseline; gap:8px; margin:14px 0}
.price b{font-family:var(--disp); font-size:56px; color:var(--bone); line-height:.9}
.price span{color:var(--ash2); font-weight:700; font-size:13px}
.ticks{list-style:none; padding:0; margin:14px 0; display:grid; grid-template-columns:1fr 1fr; gap:8px}
.ticks li{display:flex; gap:9px; font-size:14px; color:#E4D7CC}
.ticks li::before{content:'\25B8'; color:var(--vine); font-weight:800}

.olympe-banner{border:1px solid #6B5A22; background:linear-gradient(120deg,rgba(212,175,55,.13),transparent 65%); border-radius:var(--r); padding:28px 30px; margin-top:24px; position:relative; overflow:hidden}
.olympe-banner::after{content:''; position:absolute; right:-60px; top:-70px; width:220px; height:220px; border-radius:50%; background:var(--olympe); opacity:.14; filter:blur(30px)}
.olympe-banner h2{font-size:42px; color:var(--olympe); position:relative}
.olympe-banner .kicker{color:var(--olympe); border-color:#6B5A22; background:rgba(212,175,55,.09)}

.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:13px}
.badge{border:1px solid var(--edge); border-radius:var(--r); padding:17px; text-align:center; background:var(--pit); opacity:.38; filter:grayscale(1); transition:opacity .25s, filter .25s}
.badge.got{opacity:1; filter:none; border-color:var(--edge2)}
.badge .ico{font-size:32px; line-height:1}
.badge b{display:block; font-family:var(--disp); font-size:20px; margin-top:8px; letter-spacing:.03em}
.badge span{font-size:11.5px; color:var(--ash2); display:block; line-height:1.45; margin-top:3px}

#toasts{position:fixed; right:22px; bottom:22px; z-index:200; display:flex; flex-direction:column; gap:10px; align-items:flex-end}
.toast{
  background:linear-gradient(120deg,var(--slab2),var(--pit)); border:1px solid var(--edge2); border-left:3px solid var(--ember);
  border-radius:var(--r-s); padding:13px 18px; box-shadow:var(--shadow); animation:slidein .35s cubic-bezier(.2,1,.3,1) both; max-width:330px;
}
.toast b{display:block; font-family:var(--disp); font-size:20px; color:var(--ember); letter-spacing:.03em}
.toast span{font-size:13px; color:var(--ash)}
@keyframes slidein{from{opacity:0; transform:translateX(30px)} to{opacity:1; transform:none}}
#sparks{position:fixed; inset:0; pointer-events:none; z-index:190}

.foot{margin-top:70px; padding:26px 0 10px; border-top:1px solid var(--edge); color:var(--ash2); font-size:13px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}

#burger{display:none; position:fixed; top:14px; left:14px; z-index:80; background:var(--slab2); border:1px solid var(--edge2); border-radius:10px; width:44px; height:44px; cursor:pointer; font-size:19px}
@media(max-width:1080px){
  .paths,.grid3{grid-template-columns:1fr}
  .lesson-grid{grid-template-columns:minmax(0,1fr)}
  .pane.sticky{position:static}
  .stats{grid-template-columns:1fr 1fr}
}
@media(max-width:860px){
  #rail{transform:translateX(-100%); transition:transform .25s cubic-bezier(.2,.9,.3,1); width:270px; box-shadow:var(--shadow)}
  #rail.open{transform:none}
  #main{margin-left:0}
  #burger{display:block}
  .wrap{padding:0 18px}
  .view{padding-top:70px}
  .grid2,.ticks{grid-template-columns:1fr}
  .hero{padding-top:20px}
  .hero h1{font-size:clamp(64px,22vw,120px)}
  .stats{grid-template-columns:1fr 1fr}
  .cta-row{flex-direction:column; align-items:stretch}
  .cta-row .btn{justify-content:center}

  /* en-tete de jour/module : le numero, le titre et le compteur passent
     sur des lignes separees plutot que de s'ecraser sur une seule ligne */
  .day-head{flex-wrap:wrap; row-gap:8px; padding:18px 20px}
  .day-num{font-size:34px; width:auto}
  .day-head .lock{margin-left:60px; flex:0 0 auto}

  /* ligne de lecon : le badge de type passe sous le titre au lieu de
     comprimer le texte contre lui */
  .lrow{flex-wrap:wrap; row-gap:6px; padding:16px 20px}
  .lrow .kind{margin-left:42px; order:3}

  /* editeur : garde une hauteur confortable au tactile sans etre gigantesque */
  .editor textarea{min-height:170px; font-size:13px}
  .run-row .btn{flex:1 1 auto; justify-content:center}

  /* etapes lecon / exercices : les libelles se resserrent */
  .step-tab{font-size:13px; padding:9px 2px 12px}
  .step-tab span{width:20px; height:20px; font-size:11px}
}
@media(max-width:480px){
  .hero .sub{font-size:clamp(19px,6vw,26px)}
  .stats{grid-template-columns:1fr}
  .day-num{display:none}
  .day-head .lock{margin-left:0}
  .lrow .kind{margin-left:0}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important}
  html{scroll-behavior:auto}
}
</style>
