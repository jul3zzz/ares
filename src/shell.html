<title>ARES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap">

<style>
/* ============ ARES — systeme de design « le signal » ============
   Noir quasi-pur, hierarchie par opacite du blanc (pas de tons chauds
   separes), panneaux « verre » (dégradé blanc tres subtil + reflet
   interieur), boutons en pilule. L'ember reste la SEULE couleur de
   marque, utilisee avec parcimonie (CTA principal, trait sous le titre,
   accents fonctionnels de langage). Zero glow colore, zero flou decoratif :
   toute la profondeur vient de l'opacite et des lisérés, pas de la lumiere. */
:root{
  --coal:#0A0A0A; --pit:rgba(255,255,255,.035); --slab:rgba(255,255,255,.06); --slab2:rgba(255,255,255,.10);
  --edge:rgba(255,255,255,.09); --edge2:rgba(255,255,255,.18);
  --bone:#FFFFFF; --ash:rgba(255,255,255,.58); --ash2:rgba(255,255,255,.38);
  --bronze:#C2551B; --ember:#F6B23D; --serpent:#4FBFB4; --vine:#7CC98A; --blood:#E2544B; --olympe:#D4AF37;
  --accent:var(--ember);
  --glass-a:rgba(255,255,255,.045); --glass-b:rgba(255,255,255,.018);
  --shadow:0 20px 44px rgba(0,0,0,.5);
  --r:14px; --r-s:9px;
  --disp:'Big Shoulders Display','Oswald','Arial Narrow',system-ui,sans-serif;
  --body:'Manrope','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono','Consolas','Courier New',monospace;
  --rail:250px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--coal); color:var(--bone);
  font-family:var(--body); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--disp); font-weight:800; line-height:.98; text-wrap:balance; margin:0; letter-spacing:.005em}
p{margin:0}
a{color:var(--ember); text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit; color:inherit}
code,pre,kbd{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--ember); outline-offset:2px; border-radius:4px}
::selection{background:rgba(246,178,61,.3)}
.hidden{display:none !important}

*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:var(--coal)}
*::-webkit-scrollbar-thumb{background:var(--edge2); border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:var(--ash2)}

/* ============ Rail de navigation ============ */
#rail{
  position:fixed; inset:0 auto 0 0; width:var(--rail); z-index:60;
  background:#050505;
  border-right:1px solid var(--edge); display:flex; flex-direction:column; gap:2px;
  padding:18px 14px; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:11px; cursor:pointer; padding:2px 4px 16px; border:0; background:none; text-align:left; width:100%}
.brand .sigil{width:40px;height:40px;flex:none}
.brand b{font-family:var(--disp); font-size:34px; letter-spacing:.10em; display:block; line-height:.85}
.brand small{color:var(--ash2); font-size:9.5px; letter-spacing:.32em; text-transform:uppercase; font-weight:800}
.rail-label{font-size:9.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--ash2); font-weight:800; margin:16px 6px 7px}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; padding:9px 11px; border-radius:99px;
  border:1px solid transparent; background:none; cursor:pointer; font-size:14px; font-weight:600; color:var(--ash);
  transition:background .16s, color .16s, transform .16s; text-align:left;
}
.nav-item:hover{background:var(--slab); color:var(--bone); transform:translateX(2px)}
.nav-item.on{background:var(--slab2); color:var(--bone); border-color:var(--edge2)}
.nav-item .dot{width:7px;height:7px;border-radius:2px;flex:none;background:var(--c,var(--ash2))}
.nav-item .lk{margin-left:auto; font-size:11px; color:var(--ash2)}
.rail-foot{margin-top:auto; padding-top:16px; border-top:1px solid var(--edge)}
.xpwrap{padding:4px 6px}
.xpline{display:flex; justify-content:space-between; align-items:baseline; font-size:11.5px; color:var(--ash); margin-bottom:6px; font-weight:700}
.xpline b{font-family:var(--disp); font-size:19px; color:var(--ember); letter-spacing:.04em}
.bar{height:6px; background:rgba(255,255,255,.06); border-radius:99px; overflow:hidden; border:1px solid var(--edge)}
.bar i{display:block; height:100%; background:var(--ember); border-radius:99px; transition:width .7s cubic-bezier(.2,.9,.3,1)}

/* ============ Zone principale ============ */
#main{margin-left:var(--rail); min-height:100vh}
.wrap{max-width:1160px; margin:0 auto; padding:0 30px}
.view{display:none; padding:52px 0 90px; animation:rise .5s cubic-bezier(.2,.9,.3,1) both}
.view.on{display:block}
@keyframes rise{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}

/* ============ Accueil ============ */
.hero{position:relative; padding:64px 0 40px; overflow:hidden}
#forge{position:absolute; inset:0; width:100%; height:100%; opacity:.4; pointer-events:none}
.hero-in{position:relative; z-index:2; max-width:820px}
.kicker{display:inline-flex; align-items:center; gap:9px; font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--ash); border:1px solid var(--edge2); background:transparent; padding:7px 14px; border-radius:99px}
.hero h1{font-size:clamp(72px,15vw,176px); letter-spacing:-.01em; margin:20px 0 0; color:var(--bone); font-weight:900}
.hero .sub{font-family:var(--body); font-size:clamp(19px,2.6vw,26px); font-weight:600; color:var(--bone); margin-top:14px}
.hero p.lead{font-size:16.5px; color:var(--ash); margin-top:18px; max-width:60ch; line-height:1.7}
.hero p.lead b{color:var(--bone); font-weight:800}
.cta-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:28px}

.btn{
  display:inline-flex; align-items:center; gap:9px; padding:12px 22px; border-radius:999px; cursor:pointer;
  font-weight:700; font-size:14px; border:1px solid var(--edge2); background:transparent; color:var(--bone);
  transition:transform .15s, box-shadow .15s, background .15s, border-color .15s; letter-spacing:.005em;
}
.btn:hover{transform:translateY(-1px); border-color:rgba(255,255,255,.32)}
.btn.primary{background:var(--ember); color:#20100A; border-color:var(--bronze); box-shadow:0 1px 2px rgba(0,0,0,.3)}
.btn.primary:hover{background:#FFC15C; border-color:var(--bronze)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 16px; font-size:13px}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}

.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin-top:46px; border-top:1px solid var(--edge)}
.stat{padding:16px 18px 0 0}
.stat b{display:block; font-family:var(--disp); font-size:38px; color:var(--bone); line-height:.95; font-weight:800}
.stat span{font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--ash2); font-weight:700}

.sec-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin:70px 0 22px; flex-wrap:wrap; border-top:1px solid var(--edge); padding-top:24px}
.sec-head h2{font-family:var(--body); font-weight:500; font-size:clamp(30px,4vw,44px)}
.sec-head p{color:var(--ash); max-width:56ch; font-size:15px}

.paths{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px}
.path-card{
  position:relative; border:1px solid var(--edge); border-radius:var(--r); overflow:hidden; cursor:pointer;
  background:linear-gradient(to bottom,var(--glass-a),var(--glass-b)); box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  padding:24px 22px 20px; text-align:left; width:100%;
  transition:transform .2s cubic-bezier(.2,.9,.3,1), border-color .2s;
}
.path-card:hover{transform:translateY(-4px); border-color:var(--c)}
.path-card::before{content:''; position:absolute; inset:0 0 auto 0; height:2px; background:var(--c)}
.path-card .glyph{font-family:var(--mono); font-size:12px; font-weight:500; color:var(--c); letter-spacing:.08em}
.path-card h3{font-size:34px; margin:8px 0 2px}
.path-card .tag{font-family:var(--mono); font-size:11px; color:var(--ash2); font-weight:500; text-transform:uppercase; letter-spacing:.1em}
.path-card p{color:var(--ash); font-size:14px; margin-top:12px; min-height:64px; line-height:1.6}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
.chip{font-size:11px; font-weight:600; padding:4px 10px; border-radius:99px; background:transparent; border:1px solid var(--edge2); color:var(--ash)}
.path-card .prog{margin-top:18px}
.path-card .prog .bar{height:5px}
.path-card .prog span{font-size:11px; color:var(--ash2); font-weight:600; display:block; margin-top:7px; letter-spacing:.04em}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.card{background:linear-gradient(to bottom,var(--glass-a),var(--glass-b)); border:1px solid var(--edge); border-radius:var(--r); padding:24px}
.card h3{font-family:var(--body); font-weight:700; font-size:18px; margin-bottom:10px}
.card p{color:var(--ash); font-size:14px; line-height:1.65}
.icon-row{display:flex; align-items:center; gap:11px; margin-bottom:10px}
.icon-badge{width:30px;height:30px;border-radius:8px; display:grid; place-items:center; background:transparent; border:1px solid var(--edge2); font-family:var(--mono); font-weight:700; font-size:13px}

/* ============ Page parcours ============ */
.path-hero{border:1px solid var(--edge); border-radius:var(--r); padding:30px 32px; background:linear-gradient(to bottom,var(--glass-a),var(--glass-b)); position:relative; overflow:hidden}
.path-hero h1{font-size:clamp(46px,8vw,84px); color:var(--c)}
.path-hero p{color:var(--ash); max-width:64ch; margin-top:12px; font-size:16px; position:relative}
.crumb{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ash2); font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:16px}
.crumb button{background:none;border:0;cursor:pointer;color:var(--ash2);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;padding:0}
.crumb button:hover{color:var(--ember)}

.day{margin-top:32px; border:1px solid var(--edge); border-radius:var(--r); background:var(--pit); overflow:hidden}
.day-head{display:flex; align-items:center; gap:18px; padding:24px 28px; border-bottom:1px solid transparent}
.day-num{font-family:var(--disp); font-size:52px; line-height:.8; color:var(--c); width:56px; flex:none; text-align:center}
.day-head h3{font-size:27px}
.day-head p{color:var(--ash2); font-size:13.5px; font-weight:600}
.day-head .lock{margin-left:auto; font-size:12px; color:var(--ash2); font-weight:700}
.lesson-list{display:flex; flex-direction:column; border-top:1px solid var(--edge)}
.lrow{display:flex; align-items:center; gap:16px; padding:18px 28px; border-bottom:1px solid var(--edge); background:none; border-left:0; border-right:0; border-top:0; cursor:pointer; text-align:left; transition:background .15s, padding-left .15s}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--slab); padding-left:29px}
.lrow .st{width:26px;height:26px;border-radius:50%;border:1px solid var(--edge2); flex:none; display:grid; place-items:center; font-size:13px; color:var(--ash2); font-weight:800}
.lrow.done .st{background:var(--vine); border-color:var(--vine); color:#0C2410}
.lrow .info{flex:1 1 auto; min-width:0}
.lrow .t{font-weight:700; font-size:15.5px}
.lrow .d{font-size:13px; color:var(--ash2)}
.lrow .kind{margin-left:auto; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--ash2); border:1px solid var(--edge2); padding:3px 9px; border-radius:99px; white-space:nowrap}
.lrow .kind[data-k="jeu"]{color:var(--ember); border-color:rgba(246,178,61,.35)}
.lrow .kind[data-k="projet"]{color:var(--serpent); border-color:rgba(79,191,180,.35)}
.lrow .kind[data-k="boss"]{color:var(--blood); border-color:rgba(226,84,75,.35)}

/* ============ Leçon ============ */
.lesson-top{display:flex; align-items:flex-start; gap:20px; flex-wrap:wrap; margin-bottom:22px}
.lesson-top h1{font-size:clamp(34px,5.5vw,52px)}
.lesson-top .goal{color:var(--ash); font-size:15.5px; margin-top:8px; max-width:66ch}

/* etapes leçon -> exercices : une seule chose a la fois a l'ecran */
.stepper{display:flex; gap:22px; border-bottom:1px solid var(--edge); margin-bottom:28px}
.step-tab{
  display:flex; align-items:center; gap:9px; padding:11px 2px 15px; margin-bottom:-1px;
  background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  font-weight:700; font-size:15px; color:var(--ash2); transition:color .15s, border-color .15s;
}
.step-tab span{
  width:23px; height:23px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:var(--slab); border:1px solid var(--edge2); font-family:var(--mono); font-size:12px; color:var(--ash2);
  transition:background .15s, border-color .15s, color .15s;
}
.step-tab:hover:not(.on){color:var(--bone)}
.step-tab.on{color:var(--bone); border-color:var(--ember)}
.step-tab.on span{background:var(--ember); border-color:var(--ember); color:#20100A}
.step-stage[hidden]{display:none}
.lesson-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:26px; align-items:start}
.lesson-grid.solo{grid-template-columns:minmax(0,1fr)}
.pane{background:var(--pit); border:1px solid var(--edge); border-radius:var(--r); padding:32px 34px}
.pane.sticky{position:sticky; top:22px}
.prose h2{font-family:var(--body); font-weight:700; font-size:24px; margin:42px 0 16px; color:var(--bone)}
.prose h2:first-child{margin-top:0}
.prose h3{font-size:19px; margin:30px 0 12px; font-family:var(--body); font-weight:700}
.prose p{margin:18px 0; color:var(--ash); font-size:15.5px; line-height:1.75}
.prose ul,.prose ol{margin:18px 0; padding-left:22px; color:var(--ash); font-size:15.5px; line-height:1.75}
.prose li{margin:9px 0}
.prose strong{color:var(--bone); font-weight:800}
.prose em{color:var(--ember); font-style:normal; font-weight:700}
.prose code{background:rgba(255,255,255,.06); border:1px solid var(--edge); padding:1.5px 6px; border-radius:5px; font-size:.9em; color:var(--ember)}
.callout{border-left:2px solid var(--cl,var(--ember)); background:var(--pit); border-radius:0 var(--r-s) var(--r-s) 0; padding:18px 22px; margin:28px 0}
.callout .h{font-family:var(--body); font-weight:800; font-size:14px; letter-spacing:.04em; text-transform:uppercase; color:var(--cl,var(--ember)); margin-bottom:6px}
.callout p{margin:6px 0; font-size:14.5px; color:var(--ash); line-height:1.65}
.callout.tip{--cl:var(--serpent)} .callout.warn{--cl:var(--blood)} .callout.key{--cl:var(--ember)}
.analogy{background:var(--pit); border:1px dashed var(--edge2); border-radius:var(--r-s); padding:14px 18px; margin:18px 0; font-size:14.5px; color:var(--ash)}
.analogy b{color:var(--serpent)}

pre.code{background:#050505; border:1px solid var(--edge); border-radius:var(--r-s); padding:15px 17px; overflow-x:auto; font-size:13.5px; line-height:1.62; margin:14px 0; tab-size:4}
pre.code .cm{color:var(--ash2)} pre.code .kw{color:var(--ember); font-weight:700} pre.code .str{color:#8FD3A0}
pre.code .nb{color:#6FC6D6} pre.code .nu{color:var(--ember)} pre.code .tg{color:var(--ember)}
.codecap{display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ash2); font-weight:700; margin-top:16px}
.codecap i{width:8px;height:8px;border-radius:2px;background:var(--ember);font-style:normal}

.out{background:#050505; border:1px solid var(--edge); border-radius:var(--r-s); padding:13px 15px; font-family:var(--mono); font-size:13px; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); min-height:52px; max-height:320px; overflow:auto; line-height:1.55}
.out .err{color:#FF8C82}
.out .muted{color:var(--ash2)}
.out-head{display:flex; align-items:center; gap:8px; font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ash2); font-weight:700; margin:14px 0 7px}
.out-head .lamp{width:7px;height:7px;border-radius:50%;background:var(--vine)}

.editor{position:relative; border:1px solid var(--edge2); border-radius:var(--r-s); overflow:hidden; background:linear-gradient(to bottom,var(--glass-a),var(--glass-b))}
.editor-bar{display:flex; align-items:center; gap:8px; padding:8px 12px; background:transparent; border-bottom:1px solid var(--edge)}
.editor-bar .dots{display:flex; gap:5px}
.editor-bar .dots i{width:9px;height:9px;border-radius:50%;background:var(--edge2)}
.editor-bar .fname{font-family:var(--mono); font-size:11.5px; color:var(--ash2)}
.editor-bar .right{margin-left:auto; display:flex; gap:6px}
.editor textarea{
  width:100%; min-height:210px; background:transparent; border:0; resize:vertical; padding:14px 16px;
  color:rgba(255,255,255,.9); font-family:var(--mono); font-size:13.5px; line-height:1.62; outline:none; tab-size:4; display:block;
}
.editor textarea::placeholder{color:var(--ash2)}
.run-row{display:flex; gap:9px; flex-wrap:wrap; margin-top:12px; align-items:center}
.verdict{padding:13px 16px; border-radius:var(--r-s); margin-top:12px; font-size:14.5px; font-weight:600; display:none; border:1px solid var(--edge2)}
.verdict.on{display:block; animation:pop .3s cubic-bezier(.2,1.2,.4,1) both}
.verdict.ok{background:rgba(124,201,138,.08); border-color:rgba(124,201,138,.3); color:#BFE9C8}
.verdict.ko{background:rgba(226,84,75,.08); border-color:rgba(226,84,75,.3); color:#F6C4BF}
.verdict b{display:block; font-family:var(--disp); font-size:22px; letter-spacing:.04em; margin-bottom:3px}
@keyframes pop{from{opacity:0; transform:scale(.97) translateY(6px)} to{opacity:1; transform:none}}

.preview{background:#fff; border-radius:var(--r-s); border:1px solid var(--edge2); padding:16px; color:#111; min-height:150px; overflow:auto; max-height:460px}

.q{border:1px solid var(--edge); border-radius:var(--r); padding:24px 26px; margin-top:22px; background:var(--pit)}
.q .num{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ash2); font-weight:700}
.q h4{font-size:19px; margin:8px 0 18px; font-family:var(--body); font-weight:800; line-height:1.4}
.opts{display:flex; flex-direction:column; gap:11px}
.opt{display:flex; align-items:center; gap:12px; padding:12px 15px; border:1px solid var(--edge2); border-radius:var(--r-s); background:transparent; cursor:pointer; text-align:left; font-size:14.5px; font-weight:600; transition:transform .13s, border-color .13s, background .13s; width:100%}
.opt:hover:not(:disabled){transform:translateX(4px); border-color:var(--ember)}
.opt .k{width:24px;height:24px;border-radius:6px; background:rgba(255,255,255,.05); border:1px solid var(--edge2); display:grid; place-items:center; font-family:var(--mono); font-size:12px; flex:none; color:var(--ash)}
.opt.good{background:rgba(124,201,138,.1); border-color:var(--vine)}
.opt.bad{background:rgba(226,84,75,.08); border-color:var(--blood)}
.opt:disabled{cursor:default}
.expl{margin-top:12px; padding:12px 15px; border-radius:var(--r-s); background:var(--pit); font-size:14px; color:var(--ash); display:none; border-left:2px solid var(--ember)}
.expl.on{display:block}

.game-hud{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.hud{background:var(--pit); border:1px solid var(--edge2); border-radius:var(--r-s); padding:9px 15px; min-width:96px}
.hud b{display:block; font-family:var(--disp); font-size:26px; line-height:1; color:var(--bone)}
.hud span{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ash2); font-weight:700}
.lines{display:flex; flex-direction:column; gap:6px; margin-top:6px}
.line{display:flex; gap:10px; align-items:center; font-family:var(--mono); font-size:13.5px; padding:9px 13px; border-radius:var(--r-s); border:1px solid var(--edge); background:#050505; cursor:pointer; text-align:left; width:100%; white-space:pre; overflow-x:auto; transition:border-color .14s, background .14s; color:rgba(255,255,255,.85)}
.line:hover{border-color:var(--ember); background:#0C0C0C}
.line .ln{color:var(--ash2); font-size:11px; width:18px; flex:none; text-align:right}
.line.good{border-color:var(--vine); background:rgba(124,201,138,.08)}
.line.bad{border-color:var(--blood); background:rgba(226,84,75,.08)}
.line.pick{border-color:var(--ember); background:rgba(246,178,61,.07)}
.timerbar{height:5px; background:rgba(255,255,255,.06); border-radius:99px; overflow:hidden; margin:10px 0 4px; border:1px solid var(--edge)}
.timerbar i{display:block;height:100%;background:var(--blood); width:100%}

.locked{position:relative}
.lock-veil{
  position:absolute; inset:0; border-radius:var(--r); backdrop-filter:blur(3px); background:rgba(5,5,5,.82);
  display:grid; place-items:center; text-align:center; padding:24px; z-index:3;
}
.lock-veil .in{max-width:360px}
.lock-veil h4{font-family:var(--disp); font-size:28px; color:var(--ember)}
.lock-veil p{font-size:13.5px; color:var(--ash); margin:6px 0 14px}
.keyform{display:flex; gap:9px; flex-wrap:wrap}
.keyform input{
  flex:1; min-width:200px; background:#050505; border:1px solid var(--edge2); border-radius:999px; padding:12px 18px;
  color:var(--bone); font-family:var(--mono); font-size:14px; letter-spacing:.08em; text-transform:uppercase;
}
.keyform input:focus{border-color:var(--ember); outline:none}
.pro-banner{border:1px solid var(--edge); background:linear-gradient(to bottom,var(--glass-a),var(--glass-b)); border-radius:var(--r); padding:26px 28px; margin-top:20px}
.pro-banner h2{font-size:38px; color:var(--ember)}
.price{display:flex; align-items:baseline; gap:8px; margin:14px 0}
.price b{font-family:var(--disp); font-size:52px; color:var(--bone); line-height:.9}
.price span{color:var(--ash2); font-weight:700; font-size:13px}
.ticks{list-style:none; padding:0; margin:14px 0; display:grid; grid-template-columns:1fr 1fr; gap:8px}
.ticks li{display:flex; gap:9px; font-size:13.5px; color:var(--ash)}
.ticks li::before{content:'—'; color:var(--ash2); font-weight:800}

.olympe-banner{border:1px solid var(--edge); background:linear-gradient(to bottom,var(--glass-a),var(--glass-b)); border-radius:var(--r); padding:28px 30px; margin-top:24px; position:relative; overflow:hidden}
.olympe-banner h2{font-size:40px; color:var(--olympe); position:relative}
.olympe-banner .kicker{color:var(--olympe); border-color:var(--edge2)}

.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:13px}
.badge{border:1px solid var(--edge); border-radius:var(--r); padding:17px; text-align:center; background:var(--pit); opacity:.38; filter:grayscale(1); transition:opacity .25s, filter .25s}
.badge.got{opacity:1; filter:none; border-color:var(--edge2)}
.badge .ico{font-size:32px; line-height:1}
.badge b{display:block; font-family:var(--disp); font-size:20px; margin-top:8px; letter-spacing:.03em}
.badge span{font-size:11.5px; color:var(--ash2); display:block; line-height:1.45; margin-top:3px}

#toasts{position:fixed; right:22px; bottom:22px; z-index:200; display:flex; flex-direction:column; gap:10px; align-items:flex-end}
.toast{
  background:#0E0E0E; border:1px solid var(--edge2); border-left:2px solid var(--ember);
  border-radius:var(--r-s); padding:13px 18px; box-shadow:var(--shadow); animation:slidein .35s cubic-bezier(.2,1,.3,1) both; max-width:330px;
}
.toast b{display:block; font-family:var(--disp); font-size:20px; color:var(--ember); letter-spacing:.03em}
.toast span{font-size:13px; color:var(--ash)}
@keyframes slidein{from{opacity:0; transform:translateX(30px)} to{opacity:1; transform:none}}
#sparks{position:fixed; inset:0; pointer-events:none; z-index:190}

.foot{margin-top:70px; padding:26px 0 10px; border-top:1px solid var(--edge); color:var(--ash2); font-size:13px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}

#burger{display:none; position:fixed; top:14px; left:14px; z-index:80; background:#141414; border:1px solid var(--edge2); border-radius:10px; width:44px; height:44px; cursor:pointer; font-size:19px; color:var(--bone)}
@media(max-width:1080px){
  .paths,.grid3{grid-template-columns:1fr}
  .lesson-grid{grid-template-columns:minmax(0,1fr)}
  .pane.sticky{position:static}
  .stats{grid-template-columns:1fr 1fr; row-gap:16px}
}
@media(max-width:860px){
  #rail{transform:translateX(-100%); transition:transform .25s cubic-bezier(.2,.9,.3,1); width:270px; box-shadow:var(--shadow)}
  #rail.open{transform:none}
  #main{margin-left:0}
  #burger{display:block}
  .wrap{padding:0 18px}
  .view{padding-top:70px}
  .grid2,.ticks{grid-template-columns:1fr}
  .hero{padding-top:20px}
  .hero h1{font-size:clamp(60px,22vw,110px)}
  .stats{grid-template-columns:1fr 1fr}
  .cta-row{flex-direction:column; align-items:stretch}
  .cta-row .btn{justify-content:center}

  /* en-tete de jour/module : le numero, le titre et le compteur passent
     sur des lignes separees plutot que de s'ecraser sur une seule ligne */
  .day-head{flex-wrap:wrap; row-gap:8px; padding:18px 20px}
  .day-num{font-size:34px; width:auto}
  .day-head .lock{margin-left:60px; flex:0 0 auto}

  /* ligne de lecon : le badge de type passe sous le titre au lieu de
     comprimer le texte contre lui */
  .lrow{flex-wrap:wrap; row-gap:6px; padding:16px 20px}
  .lrow .kind{margin-left:42px; order:3}

  /* editeur : garde une hauteur confortable au tactile sans etre gigantesque */
  .editor textarea{min-height:170px; font-size:13px}
  .run-row .btn{flex:1 1 auto; justify-content:center}

  /* etapes lecon / exercices : les libelles se resserrent */
  .step-tab{font-size:13px; padding:9px 2px 12px}
  .step-tab span{width:20px; height:20px; font-size:11px}
}
@media(max-width:480px){
  .hero .sub{font-size:clamp(17px,6vw,22px)}
  .stats{grid-template-columns:1fr}
  .day-num{display:none}
  .day-head .lock{margin-left:0}
  .lrow .kind{margin-left:0}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important}
  html{scroll-behavior:auto}
}
</style>
