<title>ARES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap">

<style>
/* ============ ARES — système de design « la forge » ============ */
:root{
  --coal:#130D0B; --pit:#1A1211; --slab:#241917; --slab2:#2E211C;
  --edge:#3B2A23; --edge2:#54392C;
  --bone:#F6ECE3; --ash:#B9A395; --ash2:#8C776C;
  --bronze:#E2762E; --ember:#F6B23D; --serpent:#4FBFB4; --vine:#7CC98A; --blood:#E2544B;
  --accent:var(--bronze);
  --shadow:0 18px 44px rgba(0,0,0,.55);
  --r:14px; --r-s:9px;
  --disp:'Big Shoulders Display','Oswald','Arial Narrow',system-ui,sans-serif;
  --body:'Manrope','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono','Consolas','Courier New',monospace;
  --rail:250px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--coal); color:var(--bone);
  font-family:var(--body); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1100px 620px at 78% -12%, rgba(226,118,46,.16), transparent 62%),
    radial-gradient(760px 520px at 4% 8%, rgba(79,191,180,.09), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:var(--disp); font-weight:800; line-height:.98; text-wrap:balance; margin:0; letter-spacing:.005em}
p{margin:0}
a{color:var(--ember); text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit; color:inherit}
code,pre,kbd{font-family:var(--mono)}
:focus-visible{outline:2.5px solid var(--ember); outline-offset:2px; border-radius:4px}
::selection{background:rgba(226,118,46,.35)}
.hidden{display:none !important}

*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:var(--pit)}
*::-webkit-scrollbar-thumb{background:var(--edge2); border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:var(--bronze)}

/* ============ Rail de navigation ============ */
#rail{
  position:fixed; inset:0 auto 0 0; width:var(--rail); z-index:60;
  background:linear-gradient(180deg,#180F0D,#120B09);
  border-right:1px solid var(--edge); display:flex; flex-direction:column; gap:2px;
  padding:18px 14px; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:11px; cursor:pointer; padding:2px 4px 16px; border:0; background:none; text-align:left; width:100%}
.brand .sigil{width:40px;height:40px;flex:none}
.brand b{font-family:var(--disp); font-size:34px; letter-spacing:.10em; display:block; line-height:.85}
.brand small{color:var(--ash2); font-size:9.5px; letter-spacing:.32em; text-transform:uppercase; font-weight:800}
.rail-label{font-size:9.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--ash2); font-weight:800; margin:16px 6px 7px}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; padding:9px 11px; border-radius:var(--r-s);
  border:1px solid transparent; background:none; cursor:pointer; font-size:14px; font-weight:600; color:var(--ash);
  transition:background .16s, color .16s, transform .16s; text-align:left;
}
.nav-item:hover{background:var(--slab); color:var(--bone); transform:translateX(2px)}
.nav-item.on{background:var(--slab2); color:var(--bone); border-color:var(--edge2)}
.nav-item .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--ash2));box-shadow:0 0 10px var(--c,transparent)}
.nav-item .lk{margin-left:auto; font-size:11px; color:var(--ash2)}
.rail-foot{margin-top:auto; padding-top:16px; border-top:1px solid var(--edge)}
.xpwrap{padding:4px 6px}
.xpline{display:flex; justify-content:space-between; align-items:baseline; font-size:11.5px; color:var(--ash); margin-bottom:6px; font-weight:700}
.xpline b{font-family:var(--disp); font-size:19px; color:var(--ember); letter-spacing:.04em}
.bar{height:7px; background:#0D0705; border-radius:99px; overflow:hidden; border:1px solid var(--edge)}
.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--bronze),var(--ember)); border-radius:99px; transition:width .7s cubic-bezier(.2,.9,.3,1)}

/* ============ Zone principale ============ */
#main{margin-left:var(--rail); min-height:100vh}
.wrap{max-width:1160px; margin:0 auto; padding:0 30px}
.view{display:none; padding:52px 0 90px; animation:rise .5s cubic-bezier(.2,.9,.3,1) both}
.view.on{display:block}
@keyframes rise{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}

/* ============ Accueil ============ */
.hero{position:relative; padding:72px 0 40px; overflow:hidden}
#forge{position:absolute; inset:0; width:100%; height:100%; opacity:.55; pointer-events:none}
.hero-in{position:relative; z-index:2; max-width:820px}
.kicker{display:inline-flex; align-items:center; gap:9px; font-size:11px; font-weight:800; letter-spacing:.24em; text-transform:uppercase; color:var(--ember); border:1px solid var(--edge2); background:rgba(246,178,61,.07); padding:7px 14px; border-radius:99px}
.hero h1{font-size:clamp(76px,15vw,190px); letter-spacing:.02em; margin:20px 0 0;
  background:linear-gradient(178deg,#FFF6EC 8%,#F6B23D 48%,#C2551B 96%); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 12px 28px rgba(226,118,46,.28));}
.hero .sub{font-family:var(--disp); font-size:clamp(24px,3.6vw,40px); font-weight:700; color:var(--bone); letter-spacing:.01em; margin-top:2px}
.hero p.lead{font-size:18.5px; color:var(--ash); margin-top:20px; max-width:62ch}
.hero p.lead b{color:var(--bone); font-weight:800}
.cta-row{display:flex; flex-wrap:wrap; gap:12px; margin-top:30px}

.btn{
  display:inline-flex; align-items:center; gap:9px; padding:13px 24px; border-radius:var(--r-s); cursor:pointer;
  font-weight:800; font-size:14.5px; border:1px solid var(--edge2); background:var(--slab); color:var(--bone);
  transition:transform .16s, box-shadow .16s, background .16s; letter-spacing:.01em;
}
.btn:hover{transform:translateY(-2px); background:var(--slab2)}
.btn.primary{background:linear-gradient(180deg,var(--ember),var(--bronze)); color:#20100A; border-color:#B85C1E; box-shadow:0 10px 26px rgba(226,118,46,.32)}
.btn.primary:hover{box-shadow:0 16px 34px rgba(226,118,46,.44)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 15px; font-size:13px}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}

.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:54px}
.stat{background:linear-gradient(180deg,var(--pit),rgba(26,18,17,.4)); border:1px solid var(--edge); border-radius:var(--r); padding:18px 20px}
.stat b{display:block; font-family:var(--disp); font-size:44px; color:var(--ember); line-height:.9}
.stat span{font-size:11.5px; text-transform:uppercase; letter-spacing:.16em; color:var(--ash2); font-weight:800}

.sec-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin:74px 0 22px; flex-wrap:wrap}
.sec-head h2{font-size:clamp(34px,5vw,54px)}
.sec-head p{color:var(--ash); max-width:56ch; font-size:15px}

.paths{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
.path-card{
  position:relative; border:1px solid var(--edge); border-radius:var(--r); overflow:hidden; cursor:pointer;
  background:linear-gradient(180deg,var(--pit),#150E0C); padding:26px 24px 22px; text-align:left; width:100%;
  transition:transform .2s cubic-bezier(.2,.9,.3,1), border-color .2s, box-shadow .2s;
}
.path-card:hover{transform:translateY(-6px); border-color:var(--c); box-shadow:0 22px 44px rgba(0,0,0,.5)}
.path-card::before{content:''; position:absolute; inset:0 0 auto 0; height:3px; background:var(--c)}
.path-card::after{content:''; position:absolute; right:-52px; top:-52px; width:150px; height:150px; border-radius:50%; background:var(--c); opacity:.09; filter:blur(18px)}
.path-card .glyph{font-family:var(--mono); font-size:13px; font-weight:700; color:var(--c); letter-spacing:.1em}
.path-card h3{font-size:37px; margin:8px 0 2px}
.path-card .tag{font-size:12.5px; color:var(--ash2); font-weight:700; text-transform:uppercase; letter-spacing:.14em}
.path-card p{color:var(--ash); font-size:14.5px; margin-top:13px; min-height:66px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
.chip{font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; background:var(--slab); border:1px solid var(--edge2); color:var(--ash)}
.path-card .prog{margin-top:18px}
.path-card .prog .bar{height:6px}
.path-card .prog span{font-size:11px; color:var(--ash2); font-weight:700; display:block; margin-top:7px; letter-spacing:.06em}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:22px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:22px}
.card{background:var(--pit); border:1px solid var(--edge); border-radius:var(--r); padding:26px}
.card h3{font-size:26px; margin-bottom:11px}
.card p{color:var(--ash); font-size:14.5px}
.icon-row{display:flex; align-items:center; gap:11px; margin-bottom:10px}
.icon-badge{width:36px;height:36px;border-radius:9px; display:grid; place-items:center; background:var(--slab2); border:1px solid var(--edge2); font-size:17px}

/* ============ Page parcours ============ */
.path-hero{border:1px solid var(--edge); border-radius:var(--r); padding:30px 32px; background:linear-gradient(120deg,var(--pit),#150E0C 70%); position:relative; overflow:hidden}
.path-hero::after{content:''; position:absolute; right:-70px; top:-90px; width:280px; height:280px; border-radius:50%; background:var(--c); opacity:.1; filter:blur(40px)}
.path-hero h1{font-size:clamp(46px,8vw,84px); color:var(--c)}
.path-hero p{color:var(--ash); max-width:64ch; margin-top:12px; font-size:16px; position:relative}
.crumb{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ash2); font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:16px}
.crumb button{background:none;border:0;cursor:pointer;color:var(--ash2);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;padding:0}
.crumb button:hover{color:var(--ember)}

.day{margin-top:34px; border:1px solid var(--edge); border-radius:var(--r); background:var(--pit); overflow:hidden}
.day-head{display:flex; align-items:center; gap:18px; padding:24px 28px; background:linear-gradient(90deg,var(--slab),transparent)}
.day-num{font-family:var(--disp); font-size:52px; line-height:.8; color:var(--c); width:56px; flex:none; text-align:center}
.day-head h3{font-size:29px}
.day-head p{color:var(--ash2); font-size:13.5px; font-weight:600}
.day-head .lock{margin-left:auto; font-size:12px; color:var(--ash2); font-weight:700}
.lesson-list{display:flex; flex-direction:column; border-top:1px solid var(--edge)}
.lrow{display:flex; align-items:center; gap:16px; padding:18px 28px; border-bottom:1px solid rgba(59,42,35,.5); background:none; border-left:0; border-right:0; border-top:0; cursor:pointer; text-align:left; transition:background .15s, padding-left .15s}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--slab); padding-left:29px}
.lrow .st{width:26px;height:26px;border-radius:50%;border:2px solid var(--edge2); flex:none; display:grid; place-items:center; font-size:13px; color:var(--ash2); font-weight:800}
.lrow.done .st{background:var(--vine); border-color:var(--vine); color:#0C2410}
.lrow .info{flex:1 1 auto; min-width:0}
.lrow .t{font-weight:700; font-size:15.5px}
.lrow .d{font-size:13px; color:var(--ash2)}
.lrow .kind{margin-left:auto; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; color:var(--ash2); border:1px solid var(--edge2); padding:3px 9px; border-radius:99px; white-space:nowrap}
.lrow .kind[data-k="jeu"]{color:var(--ember); border-color:#6B4A22}
.lrow .kind[data-k="projet"]{color:var(--serpent); border-color:#265A56}
.lrow .kind[data-k="boss"]{color:var(--blood); border-color:#6D2A26}

/* ============ Leçon ============ */
.lesson-top{display:flex; align-items:flex-start; gap:20px; flex-wrap:wrap; margin-bottom:22px}
.lesson-top h1{font-size:clamp(36px,5.5vw,58px)}
.lesson-top .goal{color:var(--ash); font-size:15.5px; margin-top:8px; max-width:66ch}

/* etapes leçon -> exercices : une seule chose a la fois a l'ecran */
.stepper{display:flex; gap:22px; border-bottom:1px solid var(--edge); margin-bottom:28px}
.step-tab{
  display:flex; align-items:center; gap:9px; padding:11px 2px 15px; margin-bottom:-1px;
  background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  font-weight:800; font-size:15px; color:var(--ash2); transition:color .15s, border-color .15s;
}
.step-tab span{
  width:23px; height:23px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:var(--slab); border:1px solid var(--edge2); font-family:var(--mono); font-size:12px; color:var(--ash2);
  transition:background .15s, border-color .15s, color .15s;
}
.step-tab:hover:not(.on){color:var(--bone)}
.step-tab.on{color:var(--bone); border-color:var(--ember)}
.step-tab.on span{background:var(--ember); border-color:var(--ember); color:#20100A}
.step-stage[hidden]{display:none}
.lesson-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:30px; align-items:start}
.lesson-grid.solo{grid-template-columns:minmax(0,1fr)}
.pane{background:var(--pit); border:1px solid var(--edge); border-radius:var(--r); padding:32px 34px}
.pane.sticky{position:sticky; top:22px}
.prose h2{font-size:27px; margin:42px 0 16px; color:var(--bone)}
.prose h2:first-child{margin-top:0}
.prose h3{font-size:20px; margin:30px 0 12px; font-family:var(--body); font-weight:800}
.prose p{margin:18px 0; color:#E4D7CC; font-size:15.5px; line-height:1.75}
.prose ul,.prose ol{margin:18px 0; padding-left:22px; color:#E4D7CC; font-size:15.5px; line-height:1.75}
.prose li{margin:9px 0}
.prose strong{color:var(--bone); font-weight:800}
.prose em{color:var(--ember); font-style:normal; font-weight:700}
.prose code{background:#0E0806; border:1px solid var(--edge); padding:1.5px 6px; border-radius:5px; font-size:.9em; color:var(--ember)}
.callout{border-left:3px solid var(--cl,var(--bronze)); background:var(--slab); border-radius:0 var(--r-s) var(--r-s) 0; padding:18px 22px; margin:28px 0}
.callout .h{font-family:var(--disp); font-size:19px; letter-spacing:.04em; color:var(--cl,var(--ember)); margin-bottom:6px}
.callout p{margin:6px 0; font-size:14.5px; color:#E4D7CC; line-height:1.65}
.callout.tip{--cl:var(--serpent)} .callout.warn{--cl:var(--blood)} .callout.key{--cl:var(--ember)}
.analogy{background:linear-gradient(120deg,rgba(79,191,180,.09),transparent); border:1px dashed #2F544F; border-radius:var(--r-s); padding:14px 18px; margin:18px 0; font-size:14.5px; color:#D9E9E7}
.analogy b{color:var(--serpent)}

pre.code{background:#0C0705; border:1px solid var(--edge); border-radius:var(--r-s); padding:15px 17px; overflow-x:auto; font-size:13.5px; line-height:1.62; margin:14px 0; tab-size:4}
pre.code .cm{color:#7C6A5F} pre.code .kw{color:#F08B4E; font-weight:700} pre.code .str{color:#8FD3A0}
pre.code .nb{color:#6FC6D6} pre.code .nu{color:#F6B23D} pre.code .tg{color:#F08B4E}
.codecap{display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ash2); font-weight:800; margin-top:16px}
.codecap i{width:8px;height:8px;border-radius:2px;background:var(--bronze);font-style:normal}

.out{background:#080504; border:1px solid var(--edge); border-radius:var(--r-s); padding:13px 15px; font-family:var(--mono); font-size:13px; white-space:pre-wrap; word-break:break-word; color:#CFE8D5; min-height:52px; max-height:320px; overflow:auto; line-height:1.55}
.out .err{color:#FF8C82}
.out .muted{color:var(--ash2)}
.out-head{display:flex; align-items:center; gap:8px; font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ash2); font-weight:800; margin:14px 0 7px}
.out-head .lamp{width:8px;height:8px;border-radius:50%;background:var(--vine); box-shadow:0 0 8px var(--vine)}

.editor{position:relative; border:1px solid var(--edge2); border-radius:var(--r-s); overflow:hidden; background:#0B0605}
.editor-bar{display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--slab); border-bottom:1px solid var(--edge)}
.editor-bar .dots{display:flex; gap:5px}
.editor-bar .dots i{width:9px;height:9px;border-radius:50%;background:var(--edge2)}
.editor-bar .fname{font-family:var(--mono); font-size:11.5px; color:var(--ash2)}
.editor-bar .right{margin-left:auto; display:flex; gap:6px}
.editor textarea{
  width:100%; min-height:210px; background:transparent; border:0; resize:vertical; padding:14px 16px;
  color:#F2E3D6; font-family:var(--mono); font-size:13.5px; line-height:1.62; outline:none; tab-size:4; display:block;
}
.editor textarea::placeholder{color:#5D4C43}
.run-row{display:flex; gap:9px; flex-wrap:wrap; margin-top:12px; align-items:center}
.verdict{padding:13px 16px; border-radius:var(--r-s); margin-top:12px; font-size:14.5px; font-weight:600; display:none; border:1px solid transparent}
.verdict.on{display:block; animation:pop .3s cubic-bezier(.2,1.2,.4,1) both}
.verdict.ok{background:rgba(124,201,138,.11); border-color:#2F5E3A; color:#BFE9C8}
.verdict.ko{background:rgba(226,84,75,.1); border-color:#6D2A26; color:#F6C4BF}
.verdict b{display:block; font-family:var(--disp); font-size:22px; letter-spacing:.04em; margin-bottom:3px}
@keyframes pop{from{opacity:0; transform:scale(.97) translateY(6px)} to{opacity:1; transform:none}}

.preview{background:#fff; border-radius:var(--r-s); border:1px solid var(--edge2); padding:16px; color:#111; min-height:150px; overflow:auto; max-height:460px}

.q{border:1px solid var(--edge); border-radius:var(--r); padding:24px 26px; margin-top:22px; background:var(--pit)}
.q .num{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ash2); font-weight:800}
.q h4{font-size:19px; margin:8px 0 18px; font-family:var(--body); font-weight:800; line-height:1.4}
.opts{display:flex; flex-direction:column; gap:11px}
.opt{display:flex; align-items:center; gap:12px; padding:12px 15px; border:1px solid var(--edge2); border-radius:var(--r-s); background:var(--slab); cursor:pointer; text-align:left; font-size:14.5px; font-weight:600; transition:transform .13s, border-color .13s, background .13s; width:100%}
.opt:hover:not(:disabled){transform:translateX(4px); border-color:var(--ember)}
.opt .k{width:24px;height:24px;border-radius:6px; background:#0D0806; border:1px solid var(--edge2); display:grid; place-items:center; font-family:var(--mono); font-size:12px; flex:none; color:var(--ash)}
.opt.good{background:rgba(124,201,138,.14); border-color:var(--vine)}
.opt.bad{background:rgba(226,84,75,.12); border-color:var(--blood)}
.opt:disabled{cursor:default}
.expl{margin-top:12px; padding:12px 15px; border-radius:var(--r-s); background:var(--slab); font-size:14px; color:#E4D7CC; display:none; border-left:3px solid var(--ember)}
.expl.on{display:block}

.game-hud{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.hud{background:var(--slab); border:1px solid var(--edge2); border-radius:var(--r-s); padding:9px 15px; min-width:96px}
.hud b{display:block; font-family:var(--disp); font-size:26px; line-height:1; color:var(--ember)}
.hud span{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ash2); font-weight:800}
.lines{display:flex; flex-direction:column; gap:6px; margin-top:6px}
.line{display:flex; gap:10px; align-items:center; font-family:var(--mono); font-size:13.5px; padding:9px 13px; border-radius:var(--r-s); border:1px solid var(--edge); background:#0C0705; cursor:pointer; text-align:left; width:100%; white-space:pre; overflow-x:auto; transition:border-color .14s, background .14s; color:#E9DACD}
.line:hover{border-color:var(--ember); background:#150D09}
.line .ln{color:var(--ash2); font-size:11px; width:18px; flex:none; text-align:right}
.line.good{border-color:var(--vine); background:rgba(124,201,138,.1)}
.line.bad{border-color:var(--blood); background:rgba(226,84,75,.1)}
.line.pick{border-color:var(--ember); background:rgba(246,178,61,.09)}
.timerbar{height:5px; background:#0D0705; border-radius:99px; overflow:hidden; margin:10px 0 4px; border:1px solid var(--edge)}

<script>
/* ===== 05-cloud.js ===== */
/* =====================================================================
   ARES — compte et synchronisation de la progression (Firebase).

   Optionnel de bout en bout : sans compte, tout continue de fonctionner
   exactement comme avant (progression uniquement dans ce navigateur).
   Avec un compte, la progression se synchronise entre tous les appareils.

   Ne fonctionne que dans un vrai navigateur avec acces reseau : sur la forge
   hebergee (GitHub Pages), le compte est disponible ; dans un apercu a
   politique reseau stricte, l'import distant echoue et le module se
   desactive proprement (CloudSync.available reste false).
   ===================================================================== */
var CloudSync = (function () {
  'use strict';
  if (typeof document === 'undefined') return { available: false, ready: true, on: function () {}, schedulePush: function () {} };

  // Identifiants publics du projet Firebase : ce ne sont pas des secrets,
  // la securite vient des regles Firestore, pas de la confidentialite de ces
  // valeurs (elles sont visibles par construction dans le code cote client).
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyDoasHqf3IIlAb7FRNwHmD67UaebUV2wwQ",
    authDomain: "ares-forge.firebaseapp.com",
    projectId: "ares-forge",
    storageBucket: "ares-forge.firebasestorage.app",
    messagingSenderId: "729912554153",
    appId: "1:729912554153:web:311aa1ae8d6c453dbd6fb8"
  };
  var SDK = "https://www.gstatic.com/firebasejs/10.14.1/";
  var COLLECTION = "ares_progress";

  var state = { available: false, ready: false, user: null, db: null, auth: null, fns: null };
  var listeners = [];
  var pushTimer = null;
  var pendingPush = null;

  function on(evt, cb) { listeners.push({ evt: evt, cb: cb }); }
  function fire(evt, detail) { listeners.forEach(function (l) { if (l.evt === evt) l.cb(detail); }); }

  function messageErreur(code) {
    var table = {
      'auth/email-already-in-use': "Cet email est deja utilise. Essaie de te connecter a la place.",
      'auth/invalid-email': "Adresse email invalide.",
      'auth/missing-password': "Le mot de passe ne peut pas etre vide.",
      'auth/weak-password': "Le mot de passe doit faire au moins 6 caracteres.",
      'auth/wrong-password': "Email ou mot de passe incorrect.",
      'auth/invalid-credential': "Email ou mot de passe incorrect.",
      'auth/user-not-found': "Aucun compte avec cet email. Cree un compte d'abord.",
      'auth/too-many-requests': "Trop de tentatives. Reessaie dans quelques minutes.",
      'auth/network-request-failed': "Pas de connexion internet."
    };
    return table[code] || "Une erreur est survenue. Reessaie.";
  }

  var initPromise = null;
  function init() {
    if (initPromise) return initPromise;
    initPromise = (function () {
      if (FIREBASE_CONFIG.apiKey === 'REMPLACER') { state.ready = true; return Promise.resolve(); }
      return Promise.all([
        import(/* webpackIgnore: true */ SDK + 'firebase-app.js'),
        import(/* webpackIgnore: true */ SDK + 'firebase-auth.js'),
        import(/* webpackIgnore: true */ SDK + 'firebase-firestore.js')
      ]).then(function (mods) {
        var appMod = mods[0], authMod = mods[1], fsMod = mods[2];
        var app = appMod.initializeApp(FIREBASE_CONFIG);
        state.auth = authMod.getAuth(app);
        state.db = fsMod.getFirestore(app);
        state.fns = { authMod: authMod, fsMod: fsMod };
        state.available = true;
        authMod.onAuthStateChanged(state.auth, function (user) {
          state.user = user;
          fire('auth', user);
          if (user) chargerDepuisCloud(user.uid);
        });
      }).catch(function () {
        state.available = false;
      }).then(function () {
        state.ready = true;
        fire('ready', state.available);
      });
    })();
    return initPromise;
  }

  function chargerDepuisCloud(uid) {
    var fsMod = state.fns.fsMod;
    fsMod.getDoc(fsMod.doc(state.db, COLLECTION, uid)).then(function (snap) {
      fire('cloud-data', snap.exists() ? snap.data().donnees : null);
    }).catch(function () { /* pas grave : on reste sur la progression locale */ });
  }

  function schedulePush(progres) {
    if (!state.available || !state.user) return;
    pendingPush = progres;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () { pousserMaintenant(); }, 1200);
  }

  function pousserMaintenant() {
    if (!state.available || !state.user || !pendingPush) return;
    var fsMod = state.fns.fsMod;
    var ref = fsMod.doc(state.db, COLLECTION, state.user.uid);
    fsMod.setDoc(ref, { donnees: pendingPush, maj: fsMod.serverTimestamp(), email: state.user.email })
      .catch(function () { /* la prochaine modification relancera l'envoi */ });
  }

  function inscrire(email, motDePasse) {
    return init().then(function () {
      if (!state.available) return { ok: false, msg: "Compte indisponible dans cet apercu." };
      return state.fns.authMod.createUserWithEmailAndPassword(state.auth, email, motDePasse)
        .then(function (cred) { return { ok: true, user: cred.user }; })
        .catch(function (e) { return { ok: false, msg: messageErreur(e.code) }; });
    });
  }

  function connecter(email, motDePasse) {
    return init().then(function () {
      if (!state.available) return { ok: false, msg: "Compte indisponible dans cet apercu." };
      return state.fns.authMod.signInWithEmailAndPassword(state.auth, email, motDePasse)
        .then(function (cred) { return { ok: true, user: cred.user }; })
        .catch(function (e) { return { ok: false, msg: messageErreur(e.code) }; });
    });
  }

  function reinitialiserMotDePasse(email) {
    return init().then(function () {
      if (!state.available) return { ok: false, msg: "Compte indisponible dans cet apercu." };
      return state.fns.authMod.sendPasswordResetEmail(state.auth, email)
        .then(function () { return { ok: true }; })
        .catch(function (e) { return { ok: false, msg: messageErreur(e.code) }; });
    });
  }

  function deconnecter() {
    if (state.available && state.auth) state.fns.authMod.signOut(state.auth);
  }

  init();

  return {
    on: on,
    init: init,
    inscrire: inscrire,
    connecter: connecter,
    deconnecter: deconnecter,
    reinitialiserMotDePasse: reinitialiserMotDePasse,
    schedulePush: schedulePush,
    get available() { return state.available; },
    get ready() { return state.ready; },
    get user() { return state.user; }
  };
})();


</script>

            { t: 'code', lang: 'html', run: true, v: `<style>\n  :root { --accent: #E2762E; --accent-clair: #F6B23D; }\n\n  .btn {\n    display: inline-flex; align-items: center; gap: 8px;\n    padding: 11px 20px; border-radius: 9px; border: 1px solid transparent;\n    font-size: 15px; font-weight: 700; cursor: pointer;\n    transition: transform .16s ease, background .16s ease;\n  }\n  .btn:hover { transform: translateY(-2px); }\n\n  .btn--principal { background: var(--accent); color: white; }\n  .btn--principal:hover { background: var(--accent-clair); color: #241917; }\n\n  .btn--fantome { background: transparent; border-color: var(--accent); color: var(--accent); }\n  .btn--fantome:hover { background: rgba(226,118,46,.12); }\n\n  .btn--danger { background: #E2544B; color: white; }\n  .btn--petit { padding: 7px 13px; font-size: 13px; }\n  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }\n</style>\n\n<button class="btn btn--principal">Valider</button>\n<button class="btn btn--fantome">Annuler</button>\n<button class="btn btn--danger btn--petit">Supprimer</button>\n<button class="btn btn--principal" disabled>Indisponible</button>` },

          id: 'pj-1-2', title: 'Closures et etat prive', kind: 'lecon', xp: 40,
          goal: 'Comprendre la mémoire des fonctions, et s\'en servir pour protéger des donnees.',
          blocks: [
            { t: 'p', v: "Une <b>closure</b> (fermeture) est une fonction qui garde l'acces aux variables de l'endroit où elle a été créée, même longtemps après." },
            { t: 'code', lang: 'js', run: true, v: `function creerBanque(soldeInitial) {\n  let solde = soldeInitial;          // invisible de l'exterieur\n\n  return {\n    deposer(montant) {\n      if (montant <= 0) return "Montant invalide";\n      solde += montant;\n      return solde;\n    },\n    retirer(montant) {\n      if (montant > solde) return "Fonds insuffisants";\n      solde -= montant;\n      return solde;\n    },\n    consulter() { return solde; }\n  };\n}\n\nconst compte = creerBanque(100);\nconsole.log(compte.deposer(50));\nconsole.log(compte.retirer(300));\nconsole.log(compte.consulter());\nconsole.log(compte.solde);          // undefined : la variable est protegee` },
            { t: 'analogy', v: "<b>L'image à retenir :</b> la closure est un coffre-fort. <code>solde</code> est a l'intérieur ; personne ne peut y toucher directement. Les seules portes sont les methodes que tu exposes, et elles vérifient chaque opération." },
            { t: 'h', v: 'Le piège classique en entretien' },
            { t: 'code', lang: 'js', run: true, v: `// Avec var : les 3 fonctions partagent la MEME variable\nvar fonctionsVar = [];\nfor (var i = 0; i < 3; i++) {\n  fonctionsVar.push(() => i);\n}\nconsole.log(fonctionsVar[0](), fonctionsVar[1](), fonctionsVar[2]());\n\n// Avec let : chaque tour a SA variable\nconst fonctionsLet = [];\nfor (let j = 0; j < 3; j++) {\n  fonctionsLet.push(() => j);\n}\nconsole.log(fonctionsLet[0](), fonctionsLet[1](), fonctionsLet[2]());` },
            { t: 'p', v: "Le premier affiche <code>3 3 3</code> : <code>var</code> ne crée qu'une seule variable pour toute la boucle. Le second affiche <code>0 1 2</code> : <code>let</code> en crée une par tour. C'est <b>la</b> raison pour laquelle on n'utilise plus jamais <code>var</code>." },
            { t: 'key', h: 'A retenir', v: "Une closure retient son environnement · elle permet des données privees · let cree une variable par tour de boucle, pas var." }
          ],
          ex: [
            {
              brief: "Écris <code>creerCoffre(code)</code> qui renvoie un objet avec <code>ouvrir(essai)</code> renvoyant <code>Ouvert</code> ou <code>Refuse</code>, et <code>changerCode(ancien, nouveau)</code> renvoyant <code>true</code> ou <code>false</code>. Le code ne doit pas être accessible directement.",
              starter: 'function creerCoffre(code) {\n  \n}\n\nconst coffre = creerCoffre("1234");\nconsole.log(coffre.ouvrir("0000"));\nconsole.log(coffre.ouvrir("1234"));\nconsole.log(coffre.changerCode("1234", "9999"));\nconsole.log(coffre.ouvrir("9999"));\nconsole.log(coffre.code);\n',
              hint: 'La variable code reste dans la fonction ; renvoie un objet avec deux methodes qui la lisent et la modifient.',
              solution: `function creerCoffre(code) {\n  return {\n    ouvrir(essai) {\n      return essai === code ? "Ouvert" : "Refuse";\n    },\n    changerCode(ancien, nouveau) {\n      if (ancien !== code) return false;\n      code = nouveau;\n      return true;\n    }\n  };\n}\n\nconst coffre = creerCoffre("1234");\nconsole.log(coffre.ouvrir("0000"));\nconsole.log(coffre.ouvrir("1234"));\nconsole.log(coffre.changerCode("1234", "9999"));\nconsole.log(coffre.ouvrir("9999"));\nconsole.log(coffre.code);`,
              tests: [{ expect: 'Refuse\nOuvert\ntrue\nOuvert\nundefined' }],
              success: "Encapsulation réussie : la donnée sensible est inaccessible de l'extérieur."
            }
          ],
          quiz: [
            { q: 'Qu\'affiche une boucle var i avec 3 closures ?', opts: ['0 1 2', '3 3 3', 'undefined'], a: 1, why: 'var partage une seule variable, qui vaut 3 à la fin de la boucle.' },
            { q: 'À quoi sert principalement une closure ?', opts: ['À accelerer le code', 'À garder un état prive', 'A créer des classes'], a: 1, why: 'Elle conserve des variables inaccessibles de l\'extérieur.' }
          ]
        }
      ]
    },

    /* ---------------- MODULE 3 ---------------- */
    {
      n: 3, title: 'DOM avance', sub: 'Delegation, formulaires, validation',
      lessons: [
        {
          id: 'pj-3-1', title: 'La delegation d\'evenements', kind: 'lecon', xp: 40,
          dom: `<ul id="liste">\n  <li>Pain <button class="sup">x</button></li>\n  <li>Lait <button class="sup">x</button></li>\n  <li>Oeufs <button class="sup">x</button></li>\n</ul>\n<p id="info">3 elements</p>`,
          goal: 'Gerer les clics sur des éléments qui n\'existent pas encore.',
          blocks: [
            { t: 'p', v: "Problème classique : tu attaches un écouteur à chaque bouton... puis tu ajoutes un élément par JavaScript, et son bouton ne fait rien. Normal : il n'existait pas au moment où tu as attache les ecouteurs." },
            { t: 'p', v: "La solution professionnelle : écouter sur le <b>parent</b>, qui lui existe toujours, et regarder d'où vient le clic. C'est la <b>delegation</b>." },
            { t: 'code', lang: 'js', dom: true, run: true, v: `const liste = document.querySelector("#liste");\n\nliste.addEventListener("click", (evenement) => {\n  const cible = evenement.target;\n  if (!cible.classList.contains("sup")) return;   // on ignore les autres clics\n  cible.parentElement.remove();\n  document.querySelector("#info").textContent =\n    liste.children.length + " elements";\n});\n\nconsole.log("Clique sur un x dans l'apercu : meme les futurs boutons marcheront.");` },
            { t: 'h', v: "L'objet evenement" },
            {
              t: 'table', head: ['Propriete', 'Contenu'],
              rows: [['<code>event.target</code>', "l'élément reellement clique"],
                     ['<code>event.currentTarget</code>', "l'élément qui écoute"],
                     ['<code>event.preventDefault()</code>', 'annule le comportement par défaut'],
                     ['<code>event.key</code>', 'la touche pressee (evenements clavier)']]
            },
            { t: 'tip', h: 'Un écouteur au lieu de mille', v: "Sur une liste de 500 éléments, la delegation utilise 1 écouteur au lieu de 500 : moins de mémoire, et ça fonctionne pour les éléments ajoutes plus tard. C'est la bonne pratique par defaut." },
            { t: 'key', h: 'A retenir', v: "Écoute sur le parent stable · event.target dit qui a été clique · filtre avec classList.contains · fonctionne pour le futur contenu." }
          ],
          ex: [
            {
              dom: true,
              brief: "Avec une <b>seule</b> ligne <code>addEventListener</code> sur <code>#liste</code>, supprime l'élément parent quand on clique sur un bouton <code>.sup</code>, et mets à jour <code>#info</code> au format <code>N elements</code>.",
              starter: 'const liste = document.querySelector("#liste");\nconst info = document.querySelector("#info");\n\n',
              hint: 'Un seul écouteur sur liste ; teste event.target.classList.contains("sup") puis .parentElement.remove().',
              solution: `const liste = document.querySelector("#liste");\nconst info = document.querySelector("#info");\n\nliste.addEventListener("click", (e) => {\n  if (!e.target.classList.contains("sup")) return;\n  e.target.parentElement.remove();\n  info.textContent = liste.children.length + " elements";\n});`,

              must: [['addEventListener', 'Il faut un ecouteur.'],

            }
          ],
          quiz: [
            { q: 'Pourquoi la delegation fonctionne-t-elle pour les éléments ajoutes plus tard ?', opts: ['Parce que l\'écouteur est sur le parent, qui existe déjà', 'Parce que JavaScript re-scanne la page', 'Ce n\'est pas le cas'], a: 0, why: 'L\'evenement remonte jusqu\'au parent, qui l\'intercepte quel que soit l\'enfant.' },
            { q: 'Que contient event.target ?', opts: ['L\'élément qui écoute', 'L\'élément reellement clique', 'La page entière'], a: 1, why: 'currentTarget est celui qui écoute, target celui qui a recu le clic.' }
          ]
        },
        {
          id: 'pj-3-2', title: 'Formulaires et validation', kind: 'lecon', xp: 40,
          dom: `<form id="form">\n  <input id="pseudo" placeholder="Pseudo">\n  <input id="age" placeholder="Age">\n  <button type="submit">Envoyer</button>\n</form>\n<p id="erreur"></p>\n<p id="resultat"></p>`,

              starter: 'const form = document.querySelector("#form");\n\nform.addEventListener("submit", (e) => {\n  \n});\n',

                          ['#pseudo', 'setvalue', 'Nova'], ['#form', 'submit', ''], ['#résultat', 'text', 'Bienvenue Nova'], ['#erreur', 'text', '']],

            { q: 'La validation cote navigateur suffit-elle ?', opts: ['Oui', 'Non, le serveur doit revalider'], a: 1, why: 'Elle est facilement contournable : elle sert au confort, pas à la sécurité.' }

    /* ---------------- MODULE 4 ---------------- */
    {
      n: 4, title: 'Asynchrone', sub: 'Callbacks, promesses, async/await',
      lessons: [
        {
          id: 'pj-4-1', title: 'Le temps qui passe', kind: 'lecon', xp: 40,
          goal: 'Comprendre pourquoi le code ne s\'exécute pas toujours dans l\'ordre ou il est écrit.',
          blocks: [
            { t: 'p', v: "JavaScript n'a qu'un seul fil d'exécution. Pour ne pas bloquer la page pendant une attente (reseau, minuterie), il met les tâches longues de cote et continue." },
            { t: 'code', lang: 'js', run: true, v: `console.log("1 - Je commande une pizza");\n\nsetTimeout(() => {\n  console.log("3 - La pizza arrive");\n}, 1000);\n\nconsole.log("2 - Je mets la table pendant ce temps");` },
            { t: 'p', v: "L'ordre affiche est 1, 2, 3 : le <code>setTimeout</code> est mis en attente, le reste continue. Si JavaScript attendait, la page serait figee une seconde." },
            { t: 'analogy', v: "<b>L'image à retenir :</b> un serveur de restaurant ne reste pas plante devant la cuisine. Il prend la commande, va servir d'autres tables, et revient quand le plat est prêt. <code>setTimeout</code>, c'est la sonnette de la cuisine." },
            { t: 'h', v: 'Les callbacks imbriques : la pyramide de la honte' },
            { t: 'code', lang: 'js', run: true, v: `function etape(nom, suite) {\n  setTimeout(() => {\n    console.log(nom);\n    if (suite) suite();\n  }, 100);\n}\n\netape("Chargement", () => {\n  etape("Traitement", () => {\n    etape("Affichage", null);\n  });\n});` },
            { t: 'p', v: "Trois étapes et le code part déjà en escalier vers la droite. Avec dix étapes, c'est illisible : on appelle ça le <i>callback hell</i>. Les promesses ont été inventees pour ça." },
            { t: 'key', h: 'A retenir', v: "Un seul fil d'exécution · setTimeout differe sans bloquer · l'ordre du code n'est pas l'ordre d'exécution · les callbacks imbriques deviennent vite illisibles." }
          ],
          ex: [
            {
              brief: "Affiche dans cet ordre : <code>Debut</code> immédiatement, <code>Fin</code> immédiatement, puis <code>Milieu</code> après un setTimeout de 500 ms.",
              starter: 'console.log("Debut");\n\n',
              hint: 'Le setTimeout se place entre les deux console.log, mais son contenu s\'affiche en dernier.',
              solution: `console.log("Debut");\n\nsetTimeout(() => {\n  console.log("Milieu");\n}, 500);\n\nconsole.log("Fin");`,
              tests: [{ expect: 'Debut\nFin\nMilieu' }],
              must: [['setTimeout', 'Utilise setTimeout.']]
            },
            {
              brief: "Écris <code>compteARebours(n)</code> qui affiche n, n-1... jusqu'à 1 puis <code>Partez !</code>, en utilisant <code>setTimeout</code> à chaque etape (100 ms).",

              hint: 'Cas d\'arrêt : si n === 0 on affiche Partez ! sinon on affiche n et on rappelle la fonction avec n - 1 dans un setTimeout.',

              success: 'Recursivite + asynchrone : le motif exact des animations et des jeux.'
            }
          ],
          quiz: [
            { q: 'Qu\'affiche : log("A"); setTimeout(()=>log("B"),0); log("C") ?', opts: ['A B C', 'A C B', 'B A C'], a: 1, why: 'Même avec un delai de 0, le callback attend que le code principal soit fini.' },
            { q: 'Pourquoi ne pas bloquer le fil d\'exécution ?', opts: ['Ça consomme de la batterie', 'La page entière se fige : plus aucun clic ne répond', 'Ça fait planter le serveur'], a: 1, why: 'Un seul fil : s\'il est occupe, l\'interface ne répond plus.' }
          ]
        },
        {
          id: 'pj-4-2', title: 'Promesses et async / await', kind: 'lecon', xp: 45,
          goal: 'Lire et écrire du code asynchrone moderne, celui de tous les sites qui parlent a un serveur.',
          blocks: [
            { t: 'p', v: "Une <b>promesse</b> représente un résultat qui n'est pas encore la. Elle a trois états : en attente, tenue (<i>resolved</i>) ou rompue (<i>rejected</i>)." },
            { t: 'analogy', v: "<b>L'image à retenir :</b> le buzzer qu'on te donne au fast-food. Tu n'as pas ton plateau, mais tu as la <i>promesse</i> d'un plateau. Tu peux aller t'asseoir. Quand ça vibre : soit ton plat arrive (tenue), soit on t'annonce une rupture de stock (rompue)." },
            { t: 'h', v: 'Consommer une promesse' },

            { t: 'code', lang: 'js', run: true, v: 'const questions = [\n  { texte: "Quel mot-clé déclare une constante ?", options: ["let", "const", "var"], bonne: 1 },\n  { texte: "Que renvoie typeof 42 ?", options: ["number", "int", "string"], bonne: 0 }\n];\n\nconsole.log(questions.length + " questions");\nconsole.log(questions[0].options[questions[0].bonne]);' },

              solution: `const questions = [\n  { texte: "Combien font 2 + 2 ?", options: ["3", "4"], bonne: 1 },\n  { texte: "Quelle couleur a le ciel ?", options: ["Bleu", "Vert"], bonne: 0 }\n];\n\nconst etat = { index: 0, score: 0 };\n\nfunction afficher() {\n  const zone = document.querySelector("#choix");\n  document.querySelector("#score").textContent = "Score : " + etat.score;\n  zone.innerHTML = "";\n  if (etat.index >= questions.length) {\n    document.querySelector("#question").textContent = "Termine !";\n    return;\n  }\n  const q = questions[etat.index];\n  document.querySelector("#question").textContent = q.texte;\n  q.options.forEach((option, i) => {\n    const b = document.createElement("button");\n    b.textContent = option;\n    b.addEventListener("click", () => {\n      if (i === q.bonne) etat.score++;\n      etat.index++;\n      afficher();\n    });\n    zone.appendChild(b);\n  });\n}\n\nafficher();`,

<script>
/* ===== 25-data-hercule-js.js ===== */
/* ARES ULTRA — Module final de l'Arsenal de l'Étincelle : « Les 12 Travaux d'Hercule ».
   Douze défis de maîtrise JavaScript : closures, classes, motifs professionnels
   (debounce, throttle, mémoïsation, composition) et un composant final au DOM.  */
(function () {
  var m = {
    n: 9,
    title: "Les 12 Travaux d'Hercule",
    sub: "L'épreuve finale : douze motifs professionnels, plusieurs semaines de pratique",
    lessons: [

      {
        id: 'jh-1', title: "Travail I — Le Lion de Némée", kind: 'boss', xp: 90,
        goal: "Une peau qu'on ne peut plus jamais modifier : verrouiller un objet pour de bon.",
        blocks: [
          { t: 'p', v: "La peau du Lion de Némée est impossible à percer. En JavaScript, <code>Object.freeze()</code> rend un objet tout aussi impénétrable : plus aucune propriété ne peut être modifiée après coup, ce qui protège des données sensibles d'une modification accidentelle ailleurs dans un gros programme." },
          { t: 'code', lang: 'js', run: true, v: `const relique = Object.freeze({ nom: "Peau du Lion", puissance: 100 });\nconsole.log(Object.isFrozen(relique));\nconsole.log(relique.nom);` }
        ],
        ex: [
          {
            brief: "Écris <code>creerRelique(nom, valeur)</code> qui renvoie un objet <code>{ nom, valeur }</code> totalement figé avec <code>Object.freeze()</code>, pour qu'aucun code extérieur ne puisse plus le modifier.",
            starter: 'function creerRelique(nom, valeur) {\n  \n}\n\nconst relique = creerRelique("Peau du Lion", 100);\nconsole.log(Object.isFrozen(relique));\nconsole.log(relique.nom, relique.valeur);\n',
            hint: "return Object.freeze({ nom, valeur });",
            solution: `function creerRelique(nom, valeur) {\n  return Object.freeze({ nom, valeur });\n}\n\nconst relique = creerRelique("Peau du Lion", 100);\nconsole.log(Object.isFrozen(relique));\nconsole.log(relique.nom, relique.valeur);`,
            tests: [{ expect: 'true\nPeau du Lion 100' }],
            must: [['Object\\.freeze', 'Utilise Object.freeze() pour verrouiller l\'objet.']],
            success: "La relique est désormais increvable : personne ne pourra plus jamais la modifier."
          }
        ]
      },

      {
        id: 'jh-2', title: "Travail II — L'Hydre de Lerne", kind: 'boss', xp: 95,
        goal: "Chaque tête coupée en fait repousser deux : simuler l'aggravation avant la victoire.",
        blocks: [
          { t: 'p', v: "Même combat qu'en Python, en JavaScript cette fois : à chaque coup, la tête la plus puissante est retirée ; si sa moitié entière est encore positive, deux nouvelles têtes de cette puissance repoussent." }
        ],
        ex: [
          {
            brief: "Écris <code>combattreHydre(tetes)</code> (un tableau de nombres, modifié sur place) qui renvoie le nombre de coups nécessaires pour vider complètement le tableau, en retirant à chaque coup la tête la plus forte (<code>Math.max(...tetes)</code>).",
            starter: 'function combattreHydre(tetes) {\n  let coups = 0;\n  while (tetes.length > 0) {\n    \n  }\n  return coups;\n}\n\nconsole.log(combattreHydre([4]));\nconsole.log(combattreHydre([1, 1]));\n',
            hint: "const max = Math.max(...tetes); trouve son index avec indexOf, retire-la avec splice, incrémente coups, et si Math.floor(max / 2) > 0 fais deux push.",
            solution: `function combattreHydre(tetes) {\n  let coups = 0;\n  while (tetes.length > 0) {\n    const max = Math.max(...tetes);\n    const idx = tetes.indexOf(max);\n    tetes.splice(idx, 1);\n    coups++;\n    const moitie = Math.floor(max / 2);\n    if (moitie > 0) {\n      tetes.push(moitie, moitie);\n    }\n  }\n  return coups;\n}\n\nconsole.log(combattreHydre([4]));\nconsole.log(combattreHydre([1, 1]));`,
            tests: [{ expect: '7\n2' }]
          }
        ]
      },

      {
        id: 'jh-3', title: "Travail III — La Biche de Cérynée", kind: 'boss', xp: 100,
        goal: "Une biche trop rapide pour être brusquée : implémenter le motif professionnel du debounce.",
        blocks: [
          { t: 'p', v: "On ne capture pas la Biche d'un geste brutal : il faut attendre qu'elle se stabilise. C'est exactement le rôle du <b>debounce</b>, l'un des motifs JavaScript les plus demandés en entretien : retarder l'exécution d'une fonction jusqu'à ce que les appels rapprochés s'arrêtent — utile pour une recherche en temps réel qui n'interroge le serveur qu'une fois que l'utilisateur a fini de taper." },
          { t: 'tip', h: "Le mécanisme", v: "À chaque appel, on annule le délai précédent avec <code>clearTimeout</code> et on en programme un nouveau avec <code>setTimeout</code>. Seul le tout dernier appel d'une rafale survit jusqu'au bout." }
        ],
        ex: [
          {
            brief: "Complète <code>debounce(fn, delai)</code> : elle renvoie une fonction qui, à chaque appel, annule le délai précédent puis en programme un nouveau ; <code>fn</code> ne doit s'exécuter qu'une fois le délai écoulé sans nouvel appel.",
            starter: 'function debounce(fn, delai) {\n  let minuteur;\n  return (...args) => {\n    \n  };\n}\n\nlet compteur = 0;\nconst alerte = debounce(() => {\n  compteur++;\n  console.log("Alerte declenchee, total :", compteur);\n}, 100);\n\nalerte();\nalerte();\nalerte();\nconsole.log("Appels rapides envoyes");\n',
            hint: "clearTimeout(minuteur); minuteur = setTimeout(() => fn(...args), delai);",
            solution: `function debounce(fn, delai) {\n  let minuteur;\n  return (...args) => {\n    clearTimeout(minuteur);\n    minuteur = setTimeout(() => fn(...args), delai);\n  };\n}\n\nlet compteur = 0;\nconst alerte = debounce(() => {\n  compteur++;\n  console.log("Alerte declenchee, total :", compteur);\n}, 100);\n\nalerte();\nalerte();\nalerte();\nconsole.log("Appels rapides envoyes");`,
            tests: [{ expect: 'Appels rapides envoyes\nAlerte declenchee, total : 1' }],
            must: [['clearTimeout', 'Annule le délai précédent avec clearTimeout.'], ['setTimeout', 'Programme un nouveau délai avec setTimeout.']],
            success: "Trois appels rapprochés, une seule exécution : c'est exactement le motif utilisé par toutes les barres de recherche du web."
          }
        ]
      },

      {
        id: 'jh-4', title: "Travail IV — Le Sanglier d'Érymanthe", kind: 'boss', xp: 100,
        goal: "Le capturer à intervalles réguliers, sans jamais le brusquer d'un coup répété.",
        blocks: [
          { t: 'p', v: "Contrairement au debounce, il faut ici agir <b>régulièrement</b> même si les tentatives sont incessantes : c'est le <b>throttle</b>, qui garantit qu'une fonction ne s'exécute au maximum qu'une fois par intervalle de temps, quel que soit le nombre d'appels." }
        ],
        ex: [
          {
            brief: "Complète <code>throttle(fn, intervalle)</code> : elle renvoie une fonction qui n'exécute <code>fn</code> que si au moins <code>intervalle</code> millisecondes se sont écoulées depuis le dernier appel accepté.",
            starter: 'function throttle(fn, intervalle) {\n  let dernierAppel = 0;\n  return (...args) => {\n    \n  };\n}\n\nlet compteur = 0;\nconst tirer = throttle(() => { compteur++; }, 1000);\ntirer();\ntirer();\ntirer();\nconsole.log(compteur);\n',
            hint: "const maintenant = Date.now(); if (maintenant - dernierAppel >= intervalle) { dernierAppel = maintenant; fn(...args); }",
            solution: `function throttle(fn, intervalle) {\n  let dernierAppel = 0;\n  return (...args) => {\n    const maintenant = Date.now();\n    if (maintenant - dernierAppel >= intervalle) {\n      dernierAppel = maintenant;\n      fn(...args);\n    }\n  };\n}\n\nlet compteur = 0;\nconst tirer = throttle(() => { compteur++; }, 1000);\ntirer();\ntirer();\ntirer();\nconsole.log(compteur);`,
            tests: [{ expect: '1' }],
            must: [['Date\\.now\\(\\)', 'Utilise Date.now() pour mesurer le temps écoulé.']],

<script>
/* ===== 50-pyrun.js ===== */
/* =====================================================================
   ARES — Petit interpréteur Python écrit en JavaScript.
   Couvre le sous-ensemble enseigne sur le site : variables, types, f-strings,
   conditions, boucles, listes/dicos/tuples, fonctions, classes, exceptions,
   modules math/random, comprehensions, slicing.
   Aucun reseau, aucun serveur : tout tourne dans le navigateur.
   ===================================================================== */
var PyRun = (function () {
  'use strict';

  /* ---------- valeurs ---------- */
  // Les flottants a valeur entière sont emballes pour afficher "5.0" et non "5".
  function PyF(v) { this.v = v; }
  function mkfloat(v) { return Number.isInteger(v) ? new PyF(v) : v; }
  function isFloat(x) { return x instanceof PyF || (typeof x === 'number' && !Number.isInteger(x)); }
  function isNum(x) { return typeof x === 'number' || x instanceof PyF; }
  function N(x) { return x instanceof PyF ? x.v : x; }
  function isInt(x) { return typeof x === 'number' && Number.isInteger(x); }
  function isTuple(a) { return Array.isArray(a) && a.__tuple === true; }
  function mktuple(a) { a.__tuple = true; return a; }

  function PyFunc(name, params, defaults, body, env) {
    this.name = name; this.params = params; this.defaults = defaults; this.body = body; this.env = env;
  }
  function PyClass(name, methods, base, isExc) { this.name = name; this.methods = methods; this.base = base; this.isExc = !!isExc; }
  function PyObj(cls) { this.cls = cls; this.fields = new Map(); }
  function PyBound(self, fn, owner) { this.self = self; this.fn = fn; this.owner = owner || null; }
  function PySuper(self, cls) { this.self = self; this.cls = cls; }
  function PyModule(name, members) { this.name = name; this.members = members; }

  function Err(type, msg, line) { this.type = type; this.msg = msg; this.line = line; this.__py = true; }
  function fail(type, msg, line) { throw new Err(type, msg, line); }

  var BREAK = { sig: 'break' }, CONTINUE = { sig: 'continue' };
  function Ret(v) { this.v = v; }

  /* ================= 1. TOKENIZER ================= */
  var KEYWORDS = ['False', 'None', 'True', 'and', 'as', 'break', 'class', 'continue', 'def', 'elif',
    'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda',
    'not', 'or', 'pass', 'raise', 'return', 'try', 'while'];
  var OPS = ['**=', '//=', '==', '!=', '<=', '>=', '**', '//', '+=', '-=', '*=', '/=', '%=', '->',
    '+', '-', '*', '/', '%', '<', '>', '=', '(', ')', '[', ']', '{', '}', ',', ':', '.', ';'];

  function tokenize(src) {
    var toks = [], i = 0, line = 1, depth = 0, indents = [0], atLineStart = true;
    var s = src.replace(/\r\n?/g, '\n');
    if (s.length > 40000) fail('LimiteError', 'Ton programme est trop long pour la forge (40 000 caractères max).', 1);

    function push(t, v) { toks.push({ t: t, v: v, line: line }); }

    while (i < s.length) {
      if (atLineStart && depth === 0) {
        var j = i, col = 0;
        while (j < s.length && (s[j] === ' ' || s[j] === '\t')) { col += s[j] === '\t' ? 4 : 1; j++; }
        if (j >= s.length) { i = j; break; }
        if (s[j] === '\n') { i = j + 1; line++; continue; }          // ligne vide
        if (s[j] === '#') { while (j < s.length && s[j] !== '\n') j++; i = j; continue; }
        if (col > indents[indents.length - 1]) { indents.push(col); push('INDENT'); }
        else while (col < indents[indents.length - 1]) {
          indents.pop(); push('DEDENT');
          if (col > indents[indents.length - 1])
            fail('IndentationError', "L'indentation ne retombe sur aucun bloc connu. Aligne tes espaces (4 par niveau).", line);
        }
        i = j; atLineStart = false; continue;
      }
      var c = s[i];
      if (c === '\n') {
        line++; i++;
        if (depth === 0) { push('NEWLINE'); atLineStart = true; }
        continue;
      }
      if (c === ' ' || c === '\t' || c === '\r') { i++; continue; }
      if (c === '\\' && s[i + 1] === '\n') { i += 2; line++; continue; }
      if (c === '#') { while (i < s.length && s[i] !== '\n') i++; continue; }

      // chaînes (avec prefixe f / r)
      var pre = '', k = i;
      if (/[fFrRbB]/.test(c) && (s[i + 1] === '"' || s[i + 1] === "'")) { pre = c.toLowerCase(); k = i + 1; }
      if (s[k] === '"' || s[k] === "'") {
        var q = s[k], triple = s[k + 1] === q && s[k + 2] === q;
        var end = triple ? k + 3 : k + 1, val = '';
        while (end < s.length) {
          if (!triple && s[end] === '\n') fail('SyntaxError', 'Guillemet non ferme : une chaîne doit se terminer sur la même ligne.', line);
          if (s[end] === '\\' && !(pre === 'r')) {
            var n = s[end + 1], map = { n: '\n', t: '\t', '\\': '\\', "'": "'", '"': '"', r: '\r', '0': '\0' };
            if (n in map) { val += map[n]; end += 2; continue; }
            val += '\\'; end++; continue;
          }
          if (triple ? (s[end] === q && s[end + 1] === q && s[end + 2] === q) : s[end] === q) break;
          if (s[end] === '\n') line++;
          val += s[end]; end++;
        }
        if (end >= s.length) fail('SyntaxError', "Une chaîne de caractères n'est jamais refermee.", line);
        push(pre === 'f' ? 'FSTRING' : 'STRING', val);
        i = end + (triple ? 3 : 1);
        continue;
      }
      // nombres
      if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(s[i + 1] || ''))) {
        var num = '', dot = false;
        while (i < s.length && /[0-9_.eE]/.test(s[i])) {
          if (s[i] === '.') { if (dot) break; dot = true; }
          if ((s[i] === 'e' || s[i] === 'E') && !/[0-9+\-]/.test(s[i + 1] || '')) break;
          num += s[i]; i++;
          if ((num.slice(-1) === 'e' || num.slice(-1) === 'E') && /[+\-]/.test(s[i] || '')) { num += s[i]; i++; }
        }
        num = num.replace(/_/g, '');
        var value = parseFloat(num);
        if (isNaN(value)) fail('SyntaxError', 'Nombre mal écrit : ' + num, line);
        push('NUMBER', dot || /[eE]/.test(num) ? mkfloat(value) : value);
        continue;
      }
      // noms
      if (/[A-Za-z_À-ɏ]/.test(c)) {
        var name = '';
        while (i < s.length && /[A-Za-z0-9_À-ɏ]/.test(s[i])) { name += s[i]; i++; }
        push(KEYWORDS.indexOf(name) >= 0 ? 'KW' : 'NAME', name);
        continue;
      }
      // opérateurs
      var found = null;
      for (var o = 0; o < OPS.length; o++) if (s.substr(i, OPS[o].length) === OPS[o]) { found = OPS[o]; break; }
      if (!found) fail('SyntaxError', "Caractère inattendu : « " + c + " ». Vérifie ton clavier (accents, symboles).", line);
      if ('([{'.indexOf(found) >= 0) depth++;
      if (')]}'.indexOf(found) >= 0) depth = Math.max(0, depth - 1);
      push('OP', found); i += found.length;
    }
    if (toks.length && toks[toks.length - 1].t !== 'NEWLINE') push('NEWLINE');
    while (indents.length > 1) { indents.pop(); push('DEDENT'); }
    push('EOF');
    return toks;
  }

  /* ================= 2. PARSER ================= */
  function Parser(toks) { this.k = toks; this.i = 0; }
  Parser.prototype = {
    peek: function (n) { return this.k[this.i + (n || 0)]; },
    at: function (t, v) { var x = this.peek(); return x.t === t && (v === undefined || x.v === v); },
    atOp: function (v) { return this.at('OP', v); },
    atKw: function (v) { return this.at('KW', v); },
    next: function () { return this.k[this.i++]; },
    line: function () { return this.peek().line; },
    expect: function (t, v, what) {
      if (!this.at(t, v)) {
        var got = this.peek();
        var g = got.t === 'NEWLINE' ? 'une fin de ligne' : got.t === 'EOF' ? 'la fin du programme' : '« ' + got.v + ' »';
        fail('SyntaxError', (what || 'Il manque ' + (v ? '« ' + v + ' »' : t)) + ' — trouve ' + g + '.', got.line);
      }
      return this.next();
    },
    skipNl: function () { while (this.at('NEWLINE')) this.next(); },

    parseModule: function () {
      var body = [];
      this.skipNl();
      while (!this.at('EOF')) { body.push(this.statement()); this.skipNl(); }
      return { type: 'Module', body: body };
    },

    block: function () {
      this.expect('OP', ':', 'Il manque les deux-points « : » à la fin de la ligne');
      if (this.at('NEWLINE')) {
        this.next(); this.skipNl();
        if (!this.at('INDENT'))
          fail('IndentationError', 'Le bloc doit être indente (4 espaces) sous la ligne précédente.', this.line());
        this.next();
        var body = [];
        this.skipNl();
        while (!this.at('DEDENT') && !this.at('EOF')) { body.push(this.statement()); this.skipNl(); }
        if (this.at('DEDENT')) this.next();
        return body;
      }
      return [this.simpleStatement()];
    },

    statement: function () {
      var t = this.peek();
      if (t.t === 'KW') {
        switch (t.v) {
          case 'if': return this.ifStmt();
          case 'while': return this.whileStmt();
          case 'for': return this.forStmt();
          case 'def': return this.funcDef();
          case 'class': return this.classDef();
          case 'try': return this.tryStmt();
        }
      }
      return this.simpleStatement();
    },

    simpleStatement: function () {
      var t = this.peek(), line = t.line, st;
      if (t.t === 'KW' && (t.v === 'pass' || t.v === 'break' || t.v === 'continue')) {
        this.next(); st = { type: t.v === 'pass' ? 'Pass' : t.v === 'break' ? 'Break' : 'Continue', line: line };
      } else if (this.atKw('return')) {
        this.next();
        var val = (this.at('NEWLINE') || this.at('EOF') || this.at('DEDENT')) ? null : this.exprList();
        st = { type: 'Return', value: val, line: line };
      } else if (this.atKw('raise')) {
        this.next();
        st = { type: 'Raise', exc: (this.at('NEWLINE') ? null : this.expr()), line: line };
      } else if (this.atKw('global')) {
        this.next(); var names = [this.expect('NAME').v];
        while (this.atOp(',')) { this.next(); names.push(this.expect('NAME').v); }
        st = { type: 'Global', names: names, line: line };
      } else if (this.atKw('import') || this.atKw('from')) {
        st = this.importStmt();
      } else {
        var e = this.exprList();
        if (this.atOp(':') && (e.type === 'Name' || e.type === 'Attr' || e.type === 'Index')) {
          // annotation de type sur une variable : x: int = 5, ou juste x: int
          this.next(); this.expr();          // l'annotation elle-meme n'a aucun effet a l'execution
          if (this.atOp('=')) { this.next(); st = { type: 'Assign', targets: [e], value: this.exprList(), line: line }; }
          else st = { type: 'Pass', line: line };
        } else if (this.at('OP') && /^(\+=|-=|\*=|\/=|%=|\*\*=|\/\/=)$/.test(this.peek().v)) {
          var op = this.next().v.slice(0, -1);
          st = { type: 'AugAssign', target: e, op: op, value: this.exprList(), line: line };
        } else if (this.atOp('=')) {
          var targets = [e];
          while (this.atOp('=')) { this.next(); targets.push(this.exprList()); }
          var value = targets.pop();
          st = { type: 'Assign', targets: targets, value: value, line: line };
        } else {
          st = { type: 'ExprStmt', value: e, line: line };
        }

      if (this.atOp(';')) this.next();
      else if (!this.at('EOF') && !this.at('DEDENT')) this.expect('NEWLINE', undefined, 'Instruction incomplete');

    importStmt: function () {
