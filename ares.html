      if (this.atKw('import')) {
        this.next(); var names = [];
        do { var n = this.expect('NAME').v; var alias = n; if (this.atKw('as')) { this.next(); alias = this.expect('NAME').v; } names.push([n, alias]); }
        while (this.atOp(',') && this.next());
        return { type: 'Import', names: names, line: line };
      }
      this.next(); var mod = this.expect('NAME').v;
      this.expect('KW', 'import', 'Il manque « import » après le nom du module');
      var items = [];
      if (this.atOp('*')) { this.next(); items = '*'; }
      else do { var m = this.expect('NAME').v; var a = m; if (this.atKw('as')) { this.next(); a = this.expect('NAME').v; } items.push([m, a]); }
      while (this.atOp(',') && this.next());
      return { type: 'FromImport', mod: mod, items: items, line: line };
    },

    ifStmt: function () {
      var line = this.line(); this.next();
      var test = this.expr(), body = this.block(), orelse = [];
      this.skipNl();
      if (this.atKw('elif')) orelse = [this.ifStmt()];
      else if (this.atKw('else')) { this.next(); orelse = this.block(); }
      return { type: 'If', test: test, body: body, orelse: orelse, line: line };
    },
    whileStmt: function () {
      var line = this.line(); this.next();
      var test = this.expr(), body = this.block(), orelse = [];
      this.skipNl();
      if (this.atKw('else')) { this.next(); orelse = this.block(); }
      return { type: 'While', test: test, body: body, orelse: orelse, line: line };
    },
    forStmt: function () {
      var line = this.line(); this.next();
      var target = this.targetList();
      this.expect('KW', 'in', 'Il manque « in » dans la boucle for');
      var iter = this.exprList(), body = this.block(), orelse = [];
      this.skipNl();
      if (this.atKw('else')) { this.next(); orelse = this.block(); }
      return { type: 'For', target: target, iter: iter, body: body, orelse: orelse, line: line };
    },
    targetList: function () {
      var first = this.postfix(this.atom());
      if (this.atOp(',')) {
        var items = [first];
        while (this.atOp(',')) { this.next(); if (this.atKw('in')) break; items.push(this.postfix(this.atom())); }
        return { type: 'Tuple', items: items, line: first.line };
      }
      return first;
    },
    funcDef: function () {
      var line = this.line(); this.next();
      var name = this.expect('NAME', undefined, 'Il manque le nom de la fonction').v;
      this.expect('OP', '(', 'Il manque « ( » après le nom de la fonction');
      var params = [], defaults = {};
      while (!this.atOp(')')) {
        if (this.atOp('*')) { this.next(); var star = this.expect('NAME').v; params.push('*' + star); }
        else {
          var p = this.expect('NAME', undefined, 'Nom de paramètre attendu').v;
          if (this.atOp(':')) { this.next(); this.expr(); }          // annotation ignoree
          if (this.atOp('=')) { this.next(); defaults[p] = this.expr(); }
          params.push(p);
        }
        if (this.atOp(',')) this.next(); else break;
      }
      this.expect('OP', ')', 'Il manque « ) »');
      if (this.atOp('->')) { this.next(); this.expr(); }
      var body = this.block();
      return { type: 'FuncDef', name: name, params: params, defaults: defaults, body: body, line: line };
    },
    classDef: function () {
      var line = this.line(); this.next();
      var name = this.expect('NAME', undefined, 'Il manque le nom de la classe').v, base = null;
      if (this.atOp('(')) {
        this.next();
        if (!this.atOp(')')) base = this.expect('NAME').v;
        this.expect('OP', ')');
      }
      var body = this.block();
      return { type: 'ClassDef', name: name, base: base, body: body, line: line };
    },
    tryStmt: function () {
      var line = this.line(); this.next();
      var body = this.block(), handlers = [], orelse = [], fin = [];
      this.skipNl();
      while (this.atKw('except')) {
        this.next();
        var etype = null, ename = null;
        if (!this.atOp(':')) { etype = this.expect('NAME').v; if (this.atKw('as')) { this.next(); ename = this.expect('NAME').v; } }
        handlers.push({ etype: etype, ename: ename, body: this.block() });
        this.skipNl();
      }
      if (this.atKw('else')) { this.next(); orelse = this.block(); this.skipNl(); }
      if (this.atKw('finally')) { this.next(); fin = this.block(); }
      if (!handlers.length && !fin.length) fail('SyntaxError', 'Un « try » a besoin d’au moins un « except ».', line);
      return { type: 'Try', body: body, handlers: handlers, orelse: orelse, fin: fin, line: line };
    },

    /* --- expressions --- */
    exprList: function () {
      var first = this.expr();
      if (this.atOp(',')) {
        var items = [first];
        while (this.atOp(',')) {
          this.next();
          if (this.at('NEWLINE') || this.atOp('=') || this.at('EOF')) break;
          items.push(this.expr());
        }
        return mkNode({ type: 'Tuple', items: items, line: first.line });
      }
      return first;
    },
    expr: function () { return this.ternary(); },
    ternary: function () {
      var v = this.orExpr();
      if (this.atKw('if')) {
        this.next();
        var cond = this.orExpr();
        this.expect('KW', 'else', 'Il manque « else » dans l’expression conditionnelle');
        return { type: 'IfExp', test: cond, then: v, other: this.expr(), line: v.line };
      }
      return v;
    },
    orExpr: function () { var l = this.andExpr(); while (this.atKw('or')) { this.next(); l = { type: 'BoolOp', op: 'or', l: l, r: this.andExpr(), line: l.line }; } return l; },
    andExpr: function () { var l = this.notExpr(); while (this.atKw('and')) { this.next(); l = { type: 'BoolOp', op: 'and', l: l, r: this.notExpr(), line: l.line }; } return l; },
    notExpr: function () { if (this.atKw('not')) { var ln = this.line(); this.next(); return { type: 'Unary', op: 'not', v: this.notExpr(), line: ln }; } return this.comparison(); },
    comparison: function () {
      var l = this.arith(), ops = [], rs = [];
      for (;;) {
        var op = null;
        if (this.at('OP') && ['<', '>', '<=', '>=', '==', '!='].indexOf(this.peek().v) >= 0) op = this.next().v;
        else if (this.atKw('in')) { this.next(); op = 'in'; }
        else if (this.atKw('not') && this.peek(1).t === 'KW' && this.peek(1).v === 'in') { this.next(); this.next(); op = 'not in'; }
        else if (this.atKw('is')) { this.next(); if (this.atKw('not')) { this.next(); op = 'is not'; } else op = 'is'; }
        if (!op) break;
        ops.push(op); rs.push(this.arith());
      }
      return ops.length ? { type: 'Compare', l: l, ops: ops, rs: rs, line: l.line } : l;
    },
    arith: function () {
      var l = this.term();
      while (this.at('OP') && (this.peek().v === '+' || this.peek().v === '-')) { var op = this.next().v; l = { type: 'Bin', op: op, l: l, r: this.term(), line: l.line }; }
      return l;
    },
    term: function () {
      var l = this.factor();
      while (this.at('OP') && ['*', '/', '//', '%'].indexOf(this.peek().v) >= 0) { var op = this.next().v; l = { type: 'Bin', op: op, l: l, r: this.factor(), line: l.line }; }
      return l;
    },
    factor: function () {
      if (this.at('OP') && (this.peek().v === '-' || this.peek().v === '+')) {
        var ln = this.line(), op = this.next().v;
        return { type: 'Unary', op: op, v: this.factor(), line: ln };
      }
      return this.power();
    },
    power: function () {
      var b = this.postfix(this.atom());
      if (this.atOp('**')) { this.next(); return { type: 'Bin', op: '**', l: b, r: this.factor(), line: b.line }; }
      return b;
    },
    postfix: function (node) {
      for (;;) {
        if (this.atOp('(')) {
          this.next();
          var args = [], kwargs = {};
          while (!this.atOp(')')) {
            if (this.at('NAME') && this.peek(1).t === 'OP' && this.peek(1).v === '=' ) {
              var kn = this.next().v; this.next(); kwargs[kn] = this.expr();
            } else {
              args.push(this.expr());
              // expression generatrice : sum(x for x in liste)
              if (this.atKw('for')) {
                var gelt = args.pop();
                this.next();
                var gtgt = this.targetList();
                this.expect('KW', 'in', 'Il manque « in » dans l’expression generatrice');
                var git = this.orExpr(), gcond = null;
                if (this.atKw('if')) { this.next(); gcond = this.orExpr(); }
                args.push({ type: 'Comp', elt: gelt, target: gtgt, iter: git, cond: gcond, line: gelt.line });
              }
            }
            if (this.atOp(',')) this.next(); else break;
          }
          this.expect('OP', ')', 'Il manque une parenthèse fermante « ) »');
          node = { type: 'Call', func: node, args: args, kwargs: kwargs, line: node.line };
        } else if (this.atOp('[')) {
          this.next();
          var lo = null, hi = null, step = null, slice = false;
          if (!this.atOp(':')) lo = this.expr();
          if (this.atOp(':')) {
            slice = true; this.next();
            if (!this.atOp(']') && !this.atOp(':')) hi = this.expr();
            if (this.atOp(':')) { this.next(); if (!this.atOp(']')) step = this.expr(); }
          }
          this.expect('OP', ']', 'Il manque un crochet fermant « ] »');
          node = slice ? { type: 'Slice', obj: node, lo: lo, hi: hi, step: step, line: node.line }
                       : { type: 'Index', obj: node, idx: lo, line: node.line };
        } else if (this.atOp('.')) {
          this.next();
          var at = this.expect('NAME', undefined, 'Il manque le nom après le point').v;
          node = { type: 'Attr', obj: node, attr: at, line: node.line };
        } else break;
      }
      return node;
    },
    atom: function () {
      var t = this.peek(), line = t.line;
      if (t.t === 'NUMBER') { this.next(); return { type: 'Const', v: t.v, line: line }; }
      if (t.t === 'STRING') { this.next(); return { type: 'Const', v: t.v, line: line }; }
      if (t.t === 'FSTRING') { this.next(); return { type: 'FStr', raw: t.v, line: line }; }
      if (t.t === 'NAME') { this.next(); return { type: 'Name', id: t.v, line: line }; }
      if (t.t === 'KW') {
        if (t.v === 'True' || t.v === 'False') { this.next(); return { type: 'Const', v: t.v === 'True', line: line }; }
        if (t.v === 'None') { this.next(); return { type: 'Const', v: null, line: line }; }
        if (t.v === 'lambda') {
          this.next(); var ps = [];
          while (this.at('NAME')) { ps.push(this.next().v); if (this.atOp(',')) this.next(); }
          this.expect('OP', ':');
          return { type: 'Lambda', params: ps, body: this.expr(), line: line };
        }
        if (t.v === 'not') return this.notExpr();
      }
      if (this.atOp('(')) {
        this.next();
        if (this.atOp(')')) { this.next(); return { type: 'TupleLit', items: [], line: line }; }
        var e = this.expr();
        if (this.atOp(',')) {
          var items = [e];
          while (this.atOp(',')) { this.next(); if (this.atOp(')')) break; items.push(this.expr()); }
          this.expect('OP', ')');
          return { type: 'TupleLit', items: items, line: line };
        }
        this.expect('OP', ')', 'Il manque une parenthèse fermante « ) »');
        return e;
      }
      if (this.atOp('[')) {
        this.next();
        if (this.atOp(']')) { this.next(); return { type: 'ListLit', items: [], line: line }; }
        var first = this.expr();
        if (this.atKw('for')) {
          this.next();
          var tgt = this.targetList();
          this.expect('KW', 'in');
          var it = this.orExpr(), cond = null;
          if (this.atKw('if')) { this.next(); cond = this.orExpr(); }
          this.expect('OP', ']', 'Il manque « ] » à la fin de la comprehension');
          return { type: 'Comp', elt: first, target: tgt, iter: it, cond: cond, line: line };
        }
        var arr = [first];
        while (this.atOp(',')) { this.next(); if (this.atOp(']')) break; arr.push(this.expr()); }
        this.expect('OP', ']', 'Il manque un crochet fermant « ] »');
        return { type: 'ListLit', items: arr, line: line };
      }
      if (this.atOp('{')) {
        this.next();
        var pairs = [];
        if (this.atOp('}')) { this.next(); return { type: 'DictLit', pairs: pairs, line: line }; }
        var k0 = this.expr();
        this.expect('OP', ':', 'Dans un dictionnaire, chaque clé est suivie de « : »');
        var v0 = this.expr();
        if (this.atKw('for')) {                    // comprehension de dictionnaire
          this.next();
          var dtgt = this.targetList();
          this.expect('KW', 'in', 'Il manque « in » dans la comprehension');
          var dit = this.orExpr(), dcond = null;
          if (this.atKw('if')) { this.next(); dcond = this.orExpr(); }
          this.expect('OP', '}', 'Il manque « } » à la fin de la comprehension');
          return { type: 'DictComp', key: k0, val: v0, target: dtgt, iter: dit, cond: dcond, line: line };
        }
        pairs.push([k0, v0]);
        if (this.atOp(',')) this.next();
        while (!this.atOp('}')) {
          var k = this.expr();
          this.expect('OP', ':', 'Dans un dictionnaire, chaque clé est suivie de « : »');
          pairs.push([k, this.expr()]);
          if (this.atOp(',')) this.next(); else break;
        }
        this.expect('OP', '}', 'Il manque une accolade fermante « } »');
        return { type: 'DictLit', pairs: pairs, line: line };
      }
      fail('SyntaxError', 'Je ne comprends pas « ' + (t.v !== undefined ? t.v : t.t) + ' » ici.', line);
    }
  };
  function mkNode(n) { return n; }

  /* ================= 3. AFFICHAGE DES VALEURS ================= */
  function fmtNum(x) {
    if (x instanceof PyF) return x.v.toFixed(1);
    if (Number.isInteger(x)) return String(x);
    if (!isFinite(x)) return x > 0 ? 'inf' : (x < 0 ? '-inf' : 'nan');
    return String(x);
  }
  function str(v) {
    if (v === null || v === undefined) return 'None';
    if (typeof v === 'boolean') return v ? 'True' : 'False';
    if (isNum(v)) return fmtNum(v);
    if (typeof v === 'string') return v;
    if (Array.isArray(v)) {
      var inner = v.map(repr).join(', ');
      return isTuple(v) ? (v.length === 1 ? '(' + inner + ',)' : '(' + inner + ')') : '[' + inner + ']';
    }
    if (v instanceof Map) {
      var parts = [];
      v.forEach(function (val, key) { parts.push(repr(key) + ': ' + repr(val)); });
      return '{' + parts.join(', ') + '}';
    }
    if (v instanceof PyObj) {
      if (v.cls.isExc) return String(v.fields.get('message') || v.cls.name);
      var f = findMethod(v.cls, '__str__');
      if (f) return str(callFunction(new PyBound(v, f, findOwner(v.cls, '__str__')), [], {}, 0));
      return '<' + v.cls.name + ' objet>';
    }
    if (v instanceof PyFunc) return '<fonction ' + v.name + '>';
    if (v instanceof PyClass) return "<classe '" + v.name + "'>";
    if (v instanceof PyModule) return "<module '" + v.name + "'>";
    if (typeof v === 'function') return '<fonction native ' + (v.pyname || '?') + '>';
    return String(v);
  }
  function repr(v) {
    if (typeof v === 'string') return v.indexOf("'") >= 0 && v.indexOf('"') < 0 ? '"' + v + '"' : "'" + v.replace(/'/g, "\\'") + "'";
    if (v instanceof PyObj && !v.cls.isExc) {
      var f = findMethod(v.cls, '__repr__');
      if (f) return str(callFunction(new PyBound(v, f, findOwner(v.cls, '__repr__')), [], {}, 0));
    }
    return str(v);
  }
  function typeName(v) {
    if (v === null || v === undefined) return 'NoneType';
    if (typeof v === 'boolean') return 'bool';
    if (v instanceof PyF || (typeof v === 'number' && !Number.isInteger(v))) return 'float';
    if (typeof v === 'number') return 'int';
    if (typeof v === 'string') return 'str';
    if (isTuple(v)) return 'tuple';
    if (Array.isArray(v)) return 'list';
    if (v instanceof Map) return 'dict';
    if (v instanceof PyObj) return v.cls.name;
    return 'function';
  }
  function truthy(v) {
    if (v === null || v === undefined || v === false) return false;
    if (v === true) return true;
    if (isNum(v)) return N(v) !== 0;
    if (typeof v === 'string' || Array.isArray(v)) return v.length > 0;
    if (v instanceof Map) return v.size > 0;
    return true;
  }
  function eq(a, b) {
    if (isNum(a) && isNum(b)) return N(a) === N(b);
    if (typeof a === 'boolean' || typeof b === 'boolean') {
      if (isNum(a) || isNum(b)) return (a === true ? 1 : a === false ? 0 : N(a)) === (b === true ? 1 : b === false ? 0 : N(b));
      return a === b;
    }
    if (Array.isArray(a) && Array.isArray(b)) return a.length === b.length && a.every(function (x, i) { return eq(x, b[i]); });
    if (a instanceof Map && b instanceof Map) {
      if (a.size !== b.size) return false;
      var ok = true; a.forEach(function (v, k) { if (!b.has(k) || !eq(v, b.get(k))) ok = false; });
      return ok;
    }
    return a === b;
  }

  /* ================= 4. INTERPRETEUR ================= */
  function Env(parent) { this.vars = new Map(); this.parent = parent; this.globals = null; }
  Env.prototype.get = function (n) {
    var e = this;
    while (e) { if (e.vars.has(n)) return e.vars.get(n); e = e.parent; }
    return undefined;
  };
  Env.prototype.has = function (n) { var e = this; while (e) { if (e.vars.has(n)) return true; e = e.parent; } return false; };
  Env.prototype.set = function (n, v) {
    if (this.globals && this.globals.has(n)) { this.setGlobal(n, v); return; }
    this.vars.set(n, v);
  };
  Env.prototype.setGlobal = function (n, v) { var e = this; while (e.parent) e = e.parent; e.vars.set(n, v); };

  var ST = null;   // état courant

  function tick(line) {
    ST.steps++;
    if (ST.steps > 900000)
      fail('BoucleInfinie', "Ton programme tourne sans fin (plus de 900 000 étapes). Vérifie qu'une boucle « while » finit bien par devenir fausse.", line);
  }
  function write(text) {
    ST.buf += text;
    if (ST.buf.length > 24000) { ST.buf = ST.buf.slice(0, 24000); fail('LimiteError', 'Trop de texte affiche (24 000 caractères max). Réduis tes boucles d’affichage.', 0); }
  }

  function findMethod(cls, name) {
    var c = cls;
    while (c) { if (c.methods[name]) return c.methods[name]; c = c.base; }
    return null;
  }
  function findOwner(cls, name) {
    var c = cls;
    while (c) { if (c.methods[name]) return c; c = c.base; }
    return null;
  }

  function callFunction(fn, args, kwargs, line) {
    kwargs = kwargs || {};
    tick(line);
    if (ST.depth > 90) fail('RecursionError', 'Trop d’appels imbriques : une fonction s’appelle sans fin ?', line);
    if (fn instanceof PyBound) {
      ST.selfStack.push({ self: fn.self, owner: fn.owner });
      try { return callFunction(fn.fn, [fn.self].concat(args), kwargs, line); }
      finally { ST.selfStack.pop(); }
    }
    if (typeof fn === 'function') return fn(args, kwargs, line);
    if (fn instanceof PyClass) {
      var obj = new PyObj(fn);
      if (fn.isExc) { obj.fields.set('message', args.length ? str(args[0]) : fn.name); return obj; }
      var init = findMethod(fn, '__init__');
      if (init) callFunction(new PyBound(obj, init, findOwner(fn, '__init__')), args, kwargs, line);
      else if (args.length) fail('TypeError', fn.name + '() ne prend pas d’argument (pas de methode __init__).', line);
      return obj;
    }
    if (!(fn instanceof PyFunc)) fail('TypeError', "« " + str(fn) + " » n’est pas une fonction : on ne peut pas l’appeler avec ().", line);

    var env = new Env(fn.env), np = fn.params.length, starIdx = -1;
    for (var p = 0; p < np; p++) if (fn.params[p][0] === '*') starIdx = p;
    if (starIdx >= 0) {
      for (var a = 0; a < starIdx; a++) env.set(fn.params[a], args[a]);
      env.set(fn.params[starIdx].slice(1), mktuple(args.slice(starIdx)));
    } else {
      if (args.length > np)
        fail('TypeError', fn.name + '() attend ' + np + ' argument(s) mais en reçoit ' + args.length + '.', line);
      for (var i2 = 0; i2 < np; i2++) {
        var name = fn.params[i2];
        if (i2 < args.length) env.set(name, args[i2]);
        else if (Object.prototype.hasOwnProperty.call(kwargs, name)) env.set(name, kwargs[name]);
        else if (fn.defaults[name] !== undefined) env.set(name, evaluate(fn.defaults[name], fn.env));
        else fail('TypeError', fn.name + "() : il manque l’argument « " + name + " ».", line);
      }
      for (var kk in kwargs) if (fn.params.indexOf(kk) < 0)
        fail('TypeError', fn.name + "() ne connaît pas l’argument « " + kk + " ».", line);
    }
    ST.depth++;
    try {
      execBlock(fn.body, env);
    } catch (e) {
      if (e instanceof Ret) { ST.depth--; return e.v === undefined ? null : e.v; }
      ST.depth--; throw e;
    }
    ST.depth--;
    return null;
  }

  function iterate(v, line) {
    if (typeof v === 'string') return v.split('');
    if (Array.isArray(v)) return v.slice();
    if (v instanceof Map) { var ks = []; v.forEach(function (_, k) { ks.push(k); }); return ks; }
    fail('TypeError', 'On ne peut pas parcourir un objet de type ' + typeName(v) + ' avec une boucle for.', line);
  }

  function assign(target, value, env) {
    if (target.type === 'Name') { env.set(target.id, value); return; }
    if (target.type === 'Tuple' || target.type === 'TupleLit' || target.type === 'ListLit') {
      var vals = iterate(value, target.line);
      if (vals.length !== target.items.length)
        fail('ValueError', 'Impossible de repartir ' + vals.length + ' valeur(s) dans ' + target.items.length + ' variable(s).', target.line);
      for (var i = 0; i < vals.length; i++) assign(target.items[i], vals[i], env);
      return;
    }
    if (target.type === 'Index') {
      var obj = evaluate(target.obj, env), idx = evaluate(target.idx, env);
      if (Array.isArray(obj)) {
        var k = N(idx); if (k < 0) k += obj.length;
        if (!Number.isInteger(k) || k < 0 || k >= obj.length)
          fail('IndexError', 'Indice ' + str(idx) + ' hors de la liste (taille ' + obj.length + ').', target.line);
        obj[k] = value; return;
      }
      if (obj instanceof Map) { obj.set(keyOf(idx), value); return; }
      if (typeof obj === 'string') fail('TypeError', 'Les chaînes de caractères ne se modifient pas case par case. Crée une nouvelle chaîne.', target.line);
      fail('TypeError', 'Impossible de modifier un élément de ' + typeName(obj) + '.', target.line);
    }
    if (target.type === 'Attr') {
      var o = evaluate(target.obj, env);
      if (o instanceof PyObj) { o.fields.set(target.attr, value); return; }
      fail('AttributeError', 'Impossible d’ajouter un attribut a ' + typeName(o) + '.', target.line);
    }
    fail('SyntaxError', 'Cette expression ne peut pas recevoir de valeur avec « = ».', target.line);
  }
  function keyOf(k) { return isNum(k) ? N(k) : k; }

  function execBlock(body, env) { for (var i = 0; i < body.length; i++) exec(body[i], env); }

  function exec(node, env) {
    tick(node.line);
    switch (node.type) {
      case 'ExprStmt': evaluate(node.value, env); return;
      case 'Assign':
        var v = evaluate(node.value, env);
        for (var i = 0; i < node.targets.length; i++) assign(node.targets[i], v, env);
        return;
      case 'AugAssign':
        var cur = evaluate(node.target, env);
        assign(node.target, binop(node.op, cur, evaluate(node.value, env), node.line), env);
        return;
      case 'If':
        if (truthy(evaluate(node.test, env))) execBlock(node.body, env);
        else execBlock(node.orelse, env);
        return;
      case 'While': {
        var broke = false;
        while (truthy(evaluate(node.test, env))) {
          tick(node.line);
          try { execBlock(node.body, env); }
          catch (e) { if (e === BREAK) { broke = true; break; } if (e === CONTINUE) continue; throw e; }
        }
        if (!broke) execBlock(node.orelse, env);
        return;
      }
      case 'For': {
        var items = iterate(evaluate(node.iter, env), node.line), brk = false;
        for (var j = 0; j < items.length; j++) {
          tick(node.line);
          assign(node.target, items[j], env);
          try { execBlock(node.body, env); }
          catch (e) { if (e === BREAK) { brk = true; break; } if (e === CONTINUE) continue; throw e; }
        }
        if (!brk) execBlock(node.orelse, env);
        return;
      }
      case 'FuncDef': env.set(node.name, new PyFunc(node.name, node.params, node.defaults, node.body, env)); return;
      case 'ClassDef': {
        var methods = {}, base = node.base ? env.get(node.base) : null;
        if (node.base && !(base instanceof PyClass)) fail('NameError', 'La classe parente « ' + node.base + ' » est inconnue.', node.line);
        var cenv = new Env(env);
        for (var m = 0; m < node.body.length; m++) {
          var st = node.body[m];
          if (st.type === 'FuncDef') methods[st.name] = new PyFunc(st.name, st.params, st.defaults, st.body, cenv);
          else exec(st, cenv);
        }
        env.set(node.name, new PyClass(node.name, methods, base));
        return;
      }
      case 'Return': throw new Ret(node.value ? evaluate(node.value, env) : null);
      case 'Break': throw BREAK;
      case 'Continue': throw CONTINUE;
      case 'Pass': return;
      case 'Global':
        if (!env.globals) env.globals = new Set();
        for (var g = 0; g < node.names.length; g++) {
          env.globals.add(node.names[g]);
          if (!env.has(node.names[g])) env.setGlobal(node.names[g], null);
        }
        return;
      case 'Raise': {

      var post = t.post ? '\n' + t.post : '';

          expected: norm(t.expect), got: norm(run.out)

    }
    return { ok: true, title: 'Étincelle réussie !', msg: ex.success || 'Ton code produit exactement le résultat attendu.' };

    if (ex.balance !== false) {
      var tags = {};
      var re = /<(\/?)([a-zA-Z][a-zA-Z0-9]*)\b[^>]*?(\/?)>/g, m;
      var VOID = ['img', 'br', 'hr', 'input', 'meta', 'link', 'source', 'area', 'col'];

      for (var t2 in tags) if (tags[t2] < 0)

    }

  }

  function check(lang, code, ex) {

    if (lang === 'python') return checkPython(code, ex);

  function viewLesson(id) {
    var f = findLesson(id);
    if (!f) return viewHome();
    var l = f.lesson, p = f.path, d = f.day;
    var box = el('div');

    var top = el('div');
    top.innerHTML =
      '<div class="crumb"><button data-go="home">Accueil</button> · <button data-path="' + p.id + '">' + esc(p.name) + '</button> · ' +
      (p.pro ? 'Module ' : 'Jour ') + d.n + '</div>' +
      '<div class="lesson-top"><div style="flex:1;min-width:280px">' +
        '<span class="kicker" style="color:' + p.color + ';border-color:' + p.color + '55">' + l.kind + ' · ' + l.xp + ' XP</span>' +

        '<p class="goal">' + esc(l.goal) + '</p>' +
      '</div></div>';

    top.querySelector('[data-path]').addEventListener('click', function () { viewPath(p); });

    // Etape 1 : la leçon. Etape 2 : la pratique (exercices, jeu, quiz).

    var estJeu = l.kind === 'jeu';
    var libellePratique = estJeu ? 'Jeu' : 'Exercices';

    var lecon = el('div', 'pane prose');
    (l.blocks || []).forEach(function (b) { renderBlock(lecon, b, p, l); });
    if (!l.blocks || !l.blocks.length) lecon.innerHTML = '<p>Passe directement à la pratique →</p>';

    var suite = el('button', 'btn primary', (estJeu ? 'Passer au jeu' : 'Passer aux exercices') + ' →');
    var suiteRow = el('div', 'run-row');
    suiteRow.style.cssText = 'margin-top:26px';
    suiteRow.appendChild(suite);
    var leconEtape = el('div', 'step-stage');
    leconEtape.appendChild(lecon);
    leconEtape.appendChild(suiteRow);

    var pratique = el('div', 'step-stage');

    var retour = el('button', 'btn ghost sm', '← Revoir la leçon');
    retour.style.cssText = 'margin-bottom:20px';
    pratique.appendChild(retour);
    if (l.game) pratique.appendChild(renderGame(l));
    (l.ex || []).forEach(function (ex, i) { pratique.appendChild(renderExercise(l, p, ex, i)); });
    if (l.quiz && l.quiz.length) pratique.appendChild(renderQuiz(l));
    pratique.appendChild(renderFinish(l, p, d));

    var stepper = el('div', 'stepper');
    var tabLecon = el('button', 'step-tab on', '<span>1</span>Leçon');
    var tabPratique = el('button', 'step-tab', '<span>2</span>' + esc(libellePratique));
    stepper.appendChild(tabLecon); stepper.appendChild(tabPratique);

    function montrer(etape) {
      leconEtape.hidden = etape !== 'lecon';
      pratique.hidden = etape !== 'pratique';
      tabLecon.classList.toggle('on', etape === 'lecon');
      tabPratique.classList.toggle('on', etape === 'pratique');
      window.scrollTo(0, 0);
    }
    suite.addEventListener('click', function () { montrer('pratique'); });
    retour.addEventListener('click', function () { montrer('lecon'); });
    tabLecon.addEventListener('click', function () { montrer('lecon'); });
    tabPratique.addEventListener('click', function () { montrer('pratique'); });

    box.appendChild(stepper);
    box.appendChild(leconEtape);
    box.appendChild(pratique);
    show(wrap(box), p.id);
  }

  function renderBlock(host, b, p, l) {
    if (b.t === 'p') { host.appendChild(el('p', null, b.v)); return; }
    if (b.t === 'h') { host.appendChild(el('h2', null, esc(b.v))); return; }
    if (b.t === 'ul' || b.t === 'ol') {
      var list = el(b.t === 'ul' ? 'ul' : 'ol');
      b.v.forEach(function (x) { list.appendChild(el('li', null, x)); });
      host.appendChild(list); return;
    }
    if (b.t === 'analogy') { host.appendChild(el('div', 'analogy', b.v)); return; }
    if (b.t === 'tip' || b.t === 'warn' || b.t === 'key') {
      var titles = { tip: 'Astuce', warn: 'Attention', key: 'A retenir' };
      host.appendChild(el('div', 'callout ' + b.t, '<div class="h">' + esc(b.h || titles[b.t]) + '</div><p>' + b.v + '</p>'));
      return;
    }
    if (b.t === 'table') {
      var t = el('div');
      t.style.overflowX = 'auto';
      var rows = b.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td style="padding:9px 12px;border-top:1px solid var(--edge);color:#E4D7CC;font-size:14px">' + c + '</td>'; }).join('') + '</tr>'; }).join('');
      t.innerHTML = '<table style="width:100%;border-collapse:collapse;margin:16px 0;background:#0E0806;border:1px solid var(--edge);border-radius:9px;overflow:hidden">' +
        '<thead><tr>' + b.head.map(function (h) { return '<th style="text-align:left;padding:10px 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash2);background:var(--slab)">' + esc(h) + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + rows + '</tbody></table>';
      host.appendChild(t); return;
    }
    if (b.t === 'code') {
      var lang = b.lang || p.lang;
      var cap = el('div', 'codecap', '<i></i>' + (lang === 'python' ? 'python' : lang === 'js' ? 'javascript' : 'html'));
      host.appendChild(cap);
      var pre = el('pre', 'code');
      pre.innerHTML = hl(b.v, lang);
      host.appendChild(pre);
      if (!b.run) return;

      var tools = el('div', 'run-row');
      var btn = el('button', 'btn sm primary', '▶ Exécuter');
      var edit = el('button', 'btn sm ghost', '✎ Modifier');
      tools.appendChild(btn); tools.appendChild(edit);
      host.appendChild(tools);

      var editorWrap = el('div');
      editorWrap.style.display = 'none';
      var ta = el('textarea');
      var ed = el('div', 'editor');
      ed.appendChild(el('div', 'editor-bar', '<span class="dots"><i></i><i></i><i></i></span><span class="fname">exemple.' + (lang === 'python' ? 'py' : lang === 'js' ? 'js' : 'html') + '</span>'));
      ta.value = b.v; ta.spellcheck = false;
      ed.appendChild(ta);
      editorWrap.appendChild(ed);
      host.appendChild(editorWrap);

      var outHead = el('div', 'out-head', '<span class="lamp"></span>' + (lang === 'html' ? 'aperçu' : 'console'));
      var out = el('div', 'out');
      var prev = el('div', 'preview');
      prev.style.display = 'none';
      host.appendChild(outHead);
      if (lang === 'html' || (lang === 'js' && b.dom)) { host.appendChild(prev); prev.style.display = 'block'; }
      host.appendChild(out);
      out.innerHTML = '<span class="muted">Clique sur Exécuter pour lancer ce programme.</span>';

      edit.addEventListener('click', function () {
        var open = editorWrap.style.display === 'none';
        editorWrap.style.display = open ? 'block' : 'none';
        pre.style.display = open ? 'none' : 'block';
        edit.textContent = open ? '✕ Revenir au code d’origine' : '✎ Modifier';
        if (!open) ta.value = b.v;
      });
      btn.addEventListener('click', function () {
        var code = editorWrap.style.display === 'none' ? b.v : ta.value;
        runCode(lang, code, out, prev, b.dom ? (l.dom || '') : undefined);
      });
      return;
    }
    if (b.t === 'callout') { host.appendChild(el('div', 'callout key', '<div class="h">' + esc(b.h) + '</div><p>' + b.v + '</p>')); return; }
  }

  /* ---------- exercice ---------- */
  function renderExercise(l, p, ex, i) {
    var lang = p.lang;
    var exId = l.id + '-' + i;
    var card = el('div', 'pane');
    card.style.marginBottom = '18px';
    card.innerHTML =
      '<div class="kicker" style="border-color:var(--edge2);color:var(--ember)">Exercice ' + (i + 1) + (P.ex[exId] ? ' · ✔ réussi' : '') + '</div>' +
      '<p style="margin:14px 0 4px;font-size:15.5px;color:#E4D7CC">' + ex.brief + '</p>';

    var ed = el('div', 'editor');
    ed.appendChild(el('div', 'editor-bar',
      '<span class="dots"><i></i><i></i><i></i></span><span class="fname">exercice.' +
      (lang === 'python' ? 'py' : lang === 'js' ? 'js' : 'html') + '</span>'));
    var ta = el('textarea');
    ta.spellcheck = false;
    ta.value = (P.code && P.code[exId]) || ex.starter || '';
    ed.appendChild(ta);
    card.appendChild(ed);

    // indentation automatique avec Tab et Entrée
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        var s = ta.selectionStart;
        ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(ta.selectionEnd);
        ta.selectionStart = ta.selectionEnd = s + 4;
      }
      if (e.key === 'Enter' && lang === 'python') {
        var pos = ta.selectionStart, ligne = ta.value.slice(0, pos).split('\n').pop();
        var indent = (ligne.match(/^\s*/) || [''])[0];
        if (/:\s*$/.test(ligne)) indent += '    ';
        if (indent) {
          e.preventDefault();
          ta.value = ta.value.slice(0, pos) + '\n' + indent + ta.value.slice(ta.selectionEnd);
          ta.selectionStart = ta.selectionEnd = pos + 1 + indent.length;
        }
      }
    });
    ta.addEventListener('input', function () {
      P.code = P.code || {}; P.code[exId] = ta.value; save();
    });

    var bRun = el('button', 'btn sm', '▶ Tester mon code');

    bReset.title = 'Repartir du code de depart';
    row.appendChild(bCheck); row.appendChild(bRun); row.appendChild(bHint); row.appendChild(bSol); row.appendChild(bReset);
    card.appendChild(row);

    var verdict = el('div', 'verdict');
    card.appendChild(verdict);

    var prev = el('div', 'preview');
    prev.style.display = 'none';
    prev.style.marginTop = '12px';
    var outHead = el('div', 'out-head', '<span class="lamp"></span>' + (lang === 'html' ? 'aperçu' : 'console'));

    card.appendChild(outHead); card.appendChild(out);
    out.innerHTML = '<span class="muted">Écris ton code, puis teste-le.</span>';
    if (lang === 'html') makePreview(prev, ta.value);
    if (lang === 'js' && ex.dom) makePreview(prev, l.dom || '');

    function doRun() {
      runCode(lang, ta.value, out, prev, ex.dom ? (l.dom || '') : undefined);
    }
    function doCheck() {
      var res = Runner.check(lang, ta.value, ex);
      if (res.ok && ex.dom && ex.expectDom) res = checkDom(l, ex, ta.value);
      doRun();
      verdict.className = 'verdict on ' + (res.ok ? 'ok' : 'ko');
      var detailHTML = '';
      if (!res.ok && res.expected !== undefined) {
        detailHTML = '<div style="margin-top:10px;font-family:var(--mono);font-size:12.5px;background:#0C0705;border:1px solid var(--edge);border-radius:7px;padding:10px">' +
          '<div style="color:var(--vine)">attendu :</div><div style="white-space:pre-wrap;color:#CFE8D5">' + esc(res.expected) + '</div>' +
          '<div style="color:var(--blood);margin-top:8px">obtenu :</div><div style="white-space:pre-wrap;color:#F6C4BF">' + esc(res.got || '(rien)') + '</div></div>';
      }
      verdict.innerHTML = '<b>' + (res.ok ? '✔ ' : '✖ ') + esc(res.title) + '</b>' + esc(res.msg) + detailHTML;
      if (res.ok && !P.ex[exId]) {
        P.ex[exId] = true;
        addXP(Math.max(6, Math.round(l.xp / Math.max(1, (l.ex || []).length))), 'Exercice réussi');
        sparks();
      } else if (res.ok) { sparks(); }
    }
    bRun.addEventListener('click', doRun);
    bCheck.addEventListener('click', doCheck);
    bHint.addEventListener('click', function () {
      verdict.className = 'verdict on';
      verdict.style.background = 'var(--slab)';
      verdict.style.borderColor = 'var(--edge2)';
      verdict.style.color = '#E4D7CC';
      verdict.innerHTML = '<b style="color:var(--ember)">💡 Indice</b>' + esc(ex.hint || '');
    });
    bSol.addEventListener('click', function () {
      if (!confirm('Afficher la solution ? Essaie encore un peu : c’est en cherchant qu’on apprend.')) return;
      ta.value = ex.solution;
      P.code = P.code || {}; P.code[exId] = ta.value; save();
      verdict.className = 'verdict on';
      verdict.innerHTML = '<b style="color:var(--ember)">Solution affichee</b>Lis-la ligne par ligne, puis relance-la. Refais l’exercice de mémoire demain.';
      doRun();
    });
    bReset.addEventListener('click', function () {
      ta.value = ex.starter || '';
      P.code = P.code || {}; P.code[exId] = ta.value; save();
    });
    return card;
  }

  function nextLesson(id) {
    var flat = [], hit = -1;
    ALL.forEach(function (p) { p.days.forEach(function (d) { d.lessons.forEach(function (l) { flat.push({ l: l, p: p }); }); }); });
    for (var i = 0; i < flat.length; i++) if (flat[i].l.id === id) hit = i;
    if (hit < 0 || hit + 1 >= flat.length) return null;
    var nx = flat[hit + 1];
    if (!unlocked(nx.p)) return null;
    return nx.l;
  }

  /* ================= jeux ================= */
  function renderGame(l) {
    var g = l.game, bank = (GAMES[g.type] || {})[g.bank] || [];
    var box = el('div', 'pane');
    box.style.marginBottom = '18px';
    var state = { i: 0, score: 0, combo: 0, best: P.games[g.bank] || 0, fini: false };
    var order = bank.map(function (_, i) { return i; }).sort(function () { return Math.random() - 0.5; });

    var hud = el('div', 'game-hud');
    var zone = el('div');
    var expl = el('div', 'expl');
    box.appendChild(hud); box.appendChild(zone); box.appendChild(expl);

    function drawHud() {
      hud.innerHTML =
        '<div class="hud"><b>' + state.score + '</b><span>score</span></div>' +
        '<div class="hud"><b>x' + (1 + state.combo) + '</b><span>combo</span></div>' +
        '<div class="hud"><b>' + (state.i + (state.fini ? 0 : 1)) + '/' + bank.length + '</b><span>manche</span></div>' +
        '<div class="hud"><b>' + state.best + '</b><span>record</span></div>';
    }
    function win(pts) {
      state.combo++; state.score += pts * (1 + Math.min(4, state.combo - 1));
      addXP(3, 'Bonne réponse');
    }
    function lose() { state.combo = 0; }
    function next() {
      expl.classList.remove('on');
      state.i++;
      if (state.i >= bank.length) return end();
      draw();
    }
    function end() {
      state.fini = true;
      if (state.score > state.best) { P.games[g.bank] = state.score; state.best = state.score; save(); }
      drawHud();
      zone.innerHTML = '';
      var f = el('div', 'callout key');
      f.innerHTML = '<div class="h">Manche terminée</div><p>Score : <b>' + state.score + '</b>. ' +
        (state.score >= bank.length * 8 ? 'Excellent — tu lis le code comme un pro.' : 'Rejoue pour battre ton record : la vitesse vient avec l’habitude.') + '</p>';
      zone.appendChild(f);
      var again = el('button', 'btn primary', '↻ Rejouer');
      again.addEventListener('click', function () {
        state.i = 0; state.score = 0; state.combo = 0; state.fini = false;
        order = bank.map(function (_, i) { return i; }).sort(function () { return Math.random() - 0.5; });
        draw();
      });
      zone.appendChild(again);
      addXP(l.xp > 0 && !P.done[l.id] ? 0 : 0);
    }
    function showExpl(bon, texte, suite) {
      expl.classList.add('on');
      expl.innerHTML = (bon ? '<b style="color:var(--vine)">✔ Bien vu. </b>' : '<b style="color:var(--blood)">✖ Rate. </b>') + esc(texte);
      var b = el('button', 'btn sm primary', 'Suivant →');
      b.style.marginTop = '10px';
      b.addEventListener('click', suite || next);
      expl.appendChild(b);
    }

    function draw() {
      drawHud();
      zone.innerHTML = '';
      var item = bank[order[state.i]];

      if (g.type === 'bughunt') {
        zone.appendChild(el('p', null, '<b>Trouve la ligne fautive :</b>'));
        var lines = el('div', 'lines');
        item.lines.forEach(function (txt, li) {
          var b = el('button', 'line');
          b.innerHTML = '<span class="ln">' + (li + 1) + '</span><span>' + hl(txt, item.lang || (g.bank[0] === 'p' ? 'python' : g.bank[0] === 'w' ? 'html' : 'js')) + '</span>';
          b.addEventListener('click', function () {
            Array.prototype.forEach.call(lines.children, function (x, xi) {
              x.disabled = true;
              if (xi === item.bad) x.classList.add('good');
              else if (xi === li) x.classList.add('bad');
            });
            if (li === item.bad) win(10); else lose();
            drawHud();
            showExpl(li === item.bad, item.why);
          });
          lines.appendChild(b);
        });
        zone.appendChild(lines);
        return;
      }

      if (g.type === 'predict') {
        zone.appendChild(el('p', null, '<b>Qu’affiche ce programme ?</b>'));
        var pre = el('pre', 'code');
        pre.innerHTML = hl(item.code, item.lang === 'js' ? 'js' : 'python');
        zone.appendChild(pre);
        var inp = el('textarea');
        inp.placeholder = 'Ta réponse (une ligne par ligne affichee)';
        inp.spellcheck = false;
        var wrapEd = el('div', 'editor');
        wrapEd.appendChild(el('div', 'editor-bar', '<span class="fname">ta réponse</span>'));
        inp.style.minHeight = '80px';
        wrapEd.appendChild(inp);
        zone.appendChild(wrapEd);
        var v = el('button', 'btn primary sm', 'Valider');
        v.style.marginTop = '10px';
        v.addEventListener('click', function () {
          var bon = Runner.norm(inp.value) === Runner.norm(item.answer);
          if (bon) win(10); else lose();
          drawHud();
          v.disabled = true; inp.disabled = true;
          showExpl(bon, (bon ? '' : 'La bonne réponse est : ' + item.answer + '. ') + item.why);
        });
        zone.appendChild(v);
        return;
      }

      if (g.type === 'order') {
        zone.appendChild(el('p', null, '<b>Objectif :</b> ' + esc(item.goal) + '<br>Clique les lignes dans le bon ordre.'));
        var melange = item.lines.map(function (t, i2) { return { t: t, i: i2 }; }).sort(function () { return Math.random() - 0.5; });
        var attendu = 0, rate = false;
        var pool = el('div', 'lines');
        var built = el('div', 'lines');
        built.style.marginBottom = '12px';
        zone.appendChild(built); zone.appendChild(pool);
        melange.forEach(function (o) {
          var b = el('button', 'line');
          b.innerHTML = '<span>' + hl(o.t, item.lang === 'js' ? 'js' : item.lang === 'html' ? 'html' : 'python') + '</span>';
          b.addEventListener('click', function () {
            if (b.disabled) return;
            if (o.i === attendu) {
              b.disabled = true; b.classList.add('good');
              built.appendChild(b);
              attendu++;
              if (attendu === item.lines.length) {
                if (!rate) win(12); else win(4);
                drawHud();
                showExpl(!rate, rate ? 'Reconstitue, mais avec des erreurs de chemin. Relis l’ordre logique : on déclare avant d’utiliser.' : 'Ordre parfait du premier coup.');
              }
            } else {
              rate = true; lose(); drawHud();
              b.classList.add('bad');
              setTimeout(function () { b.classList.remove('bad'); }, 500);
            }
          });
          pool.appendChild(b);
        });
        return;
      }

      if (g.type === 'quizgame') {
        var card = el('div', 'q');
        card.innerHTML = '<div class="num">Question ' + (state.i + 1) + '</div><h4>' + esc(item.q) + '</h4>';
        var opts = el('div', 'opts');
        item.opts.forEach(function (o, oi) {
          var b = el('button', 'opt', '<span class="k">' + 'ABCD'[oi] + '</span><span>' + esc(o) + '</span>');
          b.addEventListener('click', function () {
            Array.prototype.forEach.call(opts.children, function (x, xi) {
              x.disabled = true;
              if (xi === item.a) x.classList.add('good');
              else if (xi === oi) x.classList.add('bad');
            });
            if (oi === item.a) win(10); else lose();
            drawHud();
            showExpl(oi === item.a, item.why);
          });
          opts.appendChild(b);
        });
        card.appendChild(opts);
        zone.appendChild(card);
        return;
      }
    }
    draw();
    return box;
  }

  /* braises animees derriere le titre */
  function startForge() {
    var c = $('#forge');
    if (!c) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var ctx = c.getContext('2d'), braises = [], stop = false;
    function size() { c.width = c.offsetWidth; c.height = c.offsetHeight; }
    size();
    window.addEventListener('resize', size);
    for (var i = 0; i < 46; i++) {
      braises.push({
        x: Math.random() * c.width, y: Math.random() * c.height,
        r: 0.7 + Math.random() * 2.1, v: 0.15 + Math.random() * 0.55,
        a: 0.15 + Math.random() * 0.5, dx: (Math.random() - 0.5) * 0.35
      });
    }
    // Les braises montent, puis se figent après 18 s : la page redevient
    // inactive (batterie, portables) et repart dès qu'on bouge.
    var reveil = Date.now(), anime = false;
    function frame() {
      if (stop || !document.body.contains(c)) { anime = false; return; }
      ctx.clearRect(0, 0, c.width, c.height);
      braises.forEach(function (b) {
        b.y -= b.v; b.x += b.dx;
        if (b.y < -6) { b.y = c.height + 6; b.x = Math.random() * c.width; }
        ctx.globalAlpha = b.a;
        ctx.fillStyle = b.r > 1.6 ? '#E2762E' : '#F6B23D';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      if (Date.now() - reveil < 18000 && !document.hidden) requestAnimationFrame(frame);
      else anime = false;
    }
    function relancer() {
      reveil = Date.now();
      if (!anime) { anime = true; requestAnimationFrame(frame); }
    }
    window.addEventListener('scroll', relancer, { passive: true });
    c.parentNode.addEventListener('mousemove', relancer);
    relancer();
  }

    views = $('#views');
    load();
    var today = new Date().toISOString().slice(0, 10);
    if (P.jours.indexOf(today) < 0) { P.jours.push(today); save(); }
    buildNav();
    refreshXP();
    BADGES.forEach(function (b) { if (P.badges.indexOf(b.id) < 0 && b.test()) P.badges.push(b.id); });
    save();
    refreshAccountUI();

    if (typeof CloudSync !== 'undefined') {
      CloudSync.on('ready', refreshAccountUI);
      CloudSync.on('auth', function () { refreshAccountUI(); if (current === 'profile') viewProfile(); });
      CloudSync.on('cloud-data', function (cloudData) {
        if (!cloudData) { save(); return; }   // rien sur ce compte : on envoie la progression locale
        var local = countDone(), distante = Object.keys(cloudData.done || {}).length;
        if (local > distante) {
          var garder = confirm(
            'Ta progression sur cet appareil (' + local + ' leçons) est plus avancée que celle enregistrée sur ton compte (' +
            distante + ' leçons).\n\nGarder celle de cet appareil et l’envoyer sur ton compte ?\n(Annuler = utiliser celle du compte)'
          );
          if (garder) { save(); return; }
        }
        P = Object.assign({ xp: 0, done: {}, ex: {}, quiz: {}, keys: [], badges: [], games: {}, jours: [], code: {}, sandbox: {} }, cloudData);
        try { localStorage.setItem(STORE, JSON.stringify(P)); } catch (e) { /* mode privé */ }
        refreshXP(); buildNav();
        if (current === 'profile') viewProfile();
        toast('☁ Progression synchronisée', 'La progression de ton compte a été chargée.');
      });
    }

    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-go], [data-go-path]');
      if (!t) return;
      if (t.dataset.goPath) { var p = findPath(t.dataset.goPath); if (p) viewPath(p); return; }
      var dest = t.dataset.go;
      if (dest === 'home') viewHome();
      else if (dest === 'games') viewGames();
      else if (dest === 'sandbox') viewSandbox();
      else if (dest === 'memo') viewMemo();
      else if (dest === 'profile') viewProfile();
      else if (dest === 'pro') viewPro();
    });
    $('#burger').addEventListener('click', function () { $('#rail').classList.toggle('open'); });

    viewHome();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
